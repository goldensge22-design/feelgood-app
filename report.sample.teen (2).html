<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이지훈 님의 D-CAS 결과지</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
  :root{
    --blue:#2856D6; --blue-deep:#1B3B8C; --blue-pale:#EAF0FD;
    --orange:#F5820A; --orange-pale:#FFF1DF;
    --navy:#101B33; --ink:#1F2937; --muted:#6B7280;
    --bg:#F6F8FC; --card:#FFFFFF; --line:#E4E9F2;
    --radius:18px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",-apple-system,BlinkMacSystemFont,sans-serif;
    line-height:1.6; padding-bottom:80px;}
  header.top{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,var(--blue-deep),var(--blue));
    color:#fff;padding:16px 20px 14px;}
  .top-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  header.top .brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:13px;letter-spacing:.06em;opacity:.9;}
  header.top .brand .dot{width:7px;height:7px;border-radius:50%;background:var(--orange);}
  header.top h1{font-size:19px;margin:8px 0 2px;font-weight:800;}
  header.top .meta{font-size:12.5px;opacity:.85;}
  .top-actions{display:flex;flex-direction:column;gap:6px;align-items:flex-end;flex:0 0 auto;}
  .lang-switch{position:relative;}
  .lang-btn{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.35);
    border-radius:14px;padding:6px 10px;font-size:11.5px;font-weight:700;cursor:pointer;white-space:nowrap;}
  .lang-menu{display:none;position:absolute;right:0;top:32px;background:#fff;border-radius:12px;
    box-shadow:0 8px 24px rgba(16,27,51,.18);overflow:hidden;min-width:120px;z-index:30;}
  .lang-menu.open{display:block;}
  .lang-menu button{display:block;width:100%;text-align:left;padding:9px 14px;border:none;background:#fff;
    font-size:12.5px;color:var(--ink);cursor:pointer;font-weight:600;}
  .lang-menu button:hover{background:var(--blue-pale);}
  .lang-menu button.on{color:var(--blue);font-weight:800;}
  .pdf-btn{background:var(--orange);color:#fff;border:none;border-radius:14px;padding:6px 12px;
    font-size:11.5px;font-weight:800;cursor:pointer;white-space:nowrap;}

  /* App shell: mobile stepper vs desktop sidebar */
  .app-shell{display:flex;align-items:flex-start;}
  #sidebarNav{display:none;}
  #mainColumn{flex:1;min-width:0;}

  /* Mobile stepper bar (replaces old horizontal tab strip) */
  .stepper-bar{display:flex;align-items:center;gap:8px;padding:10px 14px;background:#fff;
    border-bottom:1px solid var(--line);position:sticky;top:84px;z-index:19;}
  .stepper-bar button{border:none;background:none;cursor:pointer;}
  .stepper-nav-btn{flex:0 0 auto;width:34px;height:34px;border-radius:10px;background:var(--bg);
    color:var(--navy);font-size:16px;font-weight:800;display:flex;align-items:center;justify-content:center;}
  .stepper-nav-btn:disabled{opacity:.35;cursor:default;}
  .stepper-toc-btn{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:8px;
    background:var(--blue-pale);color:var(--blue-deep);border-radius:10px;padding:9px 10px;
    font-size:12.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .stepper-toc-btn .count{color:var(--muted);font-weight:700;}
  .stepper-toc-btn svg{width:14px;height:14px;flex:0 0 auto;}

  /* TOC overlay (mobile bottom sheet) */
  .toc-overlay{display:none;position:fixed;inset:0;z-index:40;background:rgba(16,27,51,.5);}
  .toc-overlay.open{display:flex;align-items:flex-end;}
  .toc-sheet{background:#fff;width:100%;max-height:78vh;border-radius:20px 20px 0 0;
    display:flex;flex-direction:column;animation:sheetUp .22s ease;}
  @keyframes sheetUp{from{transform:translateY(24px);opacity:.4;}to{transform:translateY(0);opacity:1;}}
  .toc-header{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 10px;
    border-bottom:1px solid var(--line);flex:0 0 auto;}
  .toc-header b{font-size:15px;color:var(--navy);}
  .toc-header button{border:none;background:var(--bg);width:30px;height:30px;border-radius:9px;
    font-size:15px;color:var(--muted);cursor:pointer;}
  .toc-list{overflow-y:auto;padding:8px 10px 20px;}
  .toc-group-label{font-size:11px;font-weight:800;color:var(--orange);padding:12px 10px 6px;letter-spacing:.03em;}
  .toc-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:none;
    background:none;padding:11px 10px;border-radius:12px;font-size:13.5px;color:var(--ink);cursor:pointer;}
  .toc-item:active{background:var(--bg);}
  .toc-item .num{flex:0 0 auto;width:22px;height:22px;border-radius:7px;background:var(--bg);
    color:var(--muted);font-size:10.5px;font-weight:800;display:flex;align-items:center;justify-content:center;}
  .toc-item.current{background:var(--blue-pale);}
  .toc-item.current .num{background:var(--blue);color:#fff;}
  .toc-item.current span.label{color:var(--blue-deep);font-weight:800;}

  /* Desktop sidebar (>=768px): independent container, same toc-item styles */
  @media (min-width:768px){
    .stepper-bar{display:none;}
    .toc-overlay{display:none !important;}
    #sidebarNav{display:block;flex:0 0 240px;width:240px;position:sticky;top:0;height:100vh;
      overflow-y:auto;background:#fff;border-right:1px solid var(--line);padding:18px 12px;}
    #sidebarNav .side-title{font-size:13px;font-weight:800;color:var(--navy);padding:0 10px 12px;}
    main{max-width:none;}
    body{display:flex;justify-content:center;}
    .app-shell{max-width:920px;width:100%;}
  }

  main{padding:22px 18px 10px;max-width:640px;margin:0 auto;}
  section{margin-bottom:34px;display:none;}
  section.active{display:block;}
  .pdf-mode section{display:block !important;}
  .pdf-mode .stepper-bar{display:none !important;}
  .eyebrow{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;
    color:var(--blue);background:var(--blue-pale);padding:5px 11px;border-radius:20px;margin-bottom:10px;}
  h2{font-size:20px;margin:0 0 6px;font-weight:800;color:var(--navy);}
  .sub{color:var(--muted);font-size:13.5px;margin:0 0 16px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px;margin-bottom:12px;box-shadow:0 1px 3px rgba(16,27,51,.04);}
  .hero-card{background:linear-gradient(150deg,var(--blue-deep) 0%,var(--blue) 55%,#3E6FE8 100%);
    color:#fff;border-radius:22px;padding:24px 20px;position:relative;overflow:hidden;}
  .hero-card::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;
    border-radius:50%;background:radial-gradient(circle,rgba(245,130,10,.35),transparent 70%);}
  .hero-tag{display:inline-block;background:rgba(255,255,255,.16);padding:4px 10px;border-radius:20px;
    font-size:11.5px;font-weight:700;margin-bottom:10px;}
  .hero-card h3{font-size:24px;margin:0 0 6px;font-weight:800;}
  .hero-card p{font-size:13.5px;opacity:.92;margin:0 0 14px;}
  .chips{display:flex;flex-wrap:wrap;gap:6px;}
  .chip{font-size:11.5px;background:rgba(255,255,255,.14);padding:5px 10px;border-radius:14px;font-weight:600;}
  .bar-row{display:flex;align-items:center;gap:10px;margin:10px 0;}
  .bar-label{width:78px;font-size:12.5px;font-weight:700;color:var(--navy);flex:0 0 auto;}
  .bar-track{flex:1;height:10px;background:var(--bg);border-radius:6px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--blue),#5C86EE);}
  .bar-fill.acc{background:linear-gradient(90deg,var(--orange),#FFA94D);}
  .bar-val{width:38px;text-align:right;font-size:12px;font-weight:800;color:var(--navy);}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .mini{background:var(--bg);border-radius:14px;padding:12px;}
  .mini h4{margin:0 0 6px;font-size:13px;color:var(--blue-deep);}
  .mini p{margin:0;font-size:12.5px;color:var(--ink);}
  ol.steps{padding-left:0;list-style:none;counter-reset:step;margin:0;}
  ol.steps li{counter-increment:step;padding-left:38px;position:relative;margin-bottom:14px;font-size:13.5px;}
  ol.steps li::before{content:counter(step);position:absolute;left:0;top:0;width:26px;height:26px;
    border-radius:50%;background:var(--blue);color:#fff;font-weight:800;font-size:12.5px;
    display:flex;align-items:center;justify-content:center;}
  ol.steps li b{display:block;color:var(--navy);margin-bottom:2px;}
  table.matrix{width:100%;border-collapse:collapse;font-size:12.5px;}
  table.matrix th{background:var(--blue-pale);color:var(--blue-deep);padding:9px 6px;font-size:11.5px;}
  table.matrix td{padding:9px 6px;text-align:center;border-bottom:1px solid var(--line);}
  table.matrix td:first-child, table.matrix th:first-child{text-align:left;font-weight:700;color:var(--navy);}
  .pct{font-weight:800;}
  .pct.top{color:var(--orange);}
  .dept-card{border-left:4px solid var(--blue);padding:12px 14px;background:var(--bg);border-radius:0 12px 12px 0;margin-bottom:10px;}
  .dept-card .rank{font-size:11px;font-weight:800;color:var(--blue);}
  .dept-card h4{margin:2px 0 5px;font-size:15px;color:var(--navy);}
  .dept-card p{margin:0;font-size:12.5px;color:var(--ink);}
  .subject-table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px;}
  .subject-table th{text-align:left;color:var(--muted);font-weight:700;font-size:11.5px;padding:6px 4px;border-bottom:2px solid var(--line);}
  .subject-table td{padding:8px 4px;border-bottom:1px solid var(--line);vertical-align:top;}
  .job-strip{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
  .job-pill{background:var(--orange-pale);color:#C25E00;font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:14px;}
  .check-item{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line);}
  .check-item:last-child{border-bottom:none;}
  .check-item input{margin-top:3px;width:17px;height:17px;accent-color:var(--blue);flex:0 0 auto;}
  .check-item label{font-size:13.5px;color:var(--ink);}
  .check-item .scale{font-size:11px;color:var(--muted);display:block;margin-top:2px;}
  .footer-cta{background:linear-gradient(135deg,var(--orange),#FFA94D);color:#fff;border-radius:18px;
    padding:18px 20px;text-align:center;margin-top:10px;}
  .footer-cta b{display:block;font-size:15px;margin-bottom:4px;}
  .footer-cta span{font-size:12px;opacity:.92;}
  .foot-note{font-size:11.5px;color:var(--muted);text-align:center;margin-top:24px;}
  .temp-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;}
  .temp-card h4{margin:0 0 10px;font-size:14px;color:var(--navy);}
  .temp-block{font-size:12.5px;margin-bottom:8px;padding-left:4px;}
  .temp-block b{display:block;font-size:12px;margin-bottom:3px;}
  .temp-block.good b{color:#1E8A5F;}
  .temp-block.watch b{color:#C25E00;}
  .temp-block ul{margin:0;padding-left:16px;}
  .temp-block li{margin-bottom:2px;}
  .role-card{background:linear-gradient(135deg,var(--orange-pale),#FFF8ED);border-radius:16px;padding:16px 18px;margin-bottom:14px;border:1px solid #FADFB3;}
  .role-card h4{margin:0 0 6px;font-size:13.5px;color:#C25E00;}
  .role-card p{margin:0;font-size:13px;}
  .record-box{background:var(--navy);color:#fff;border-radius:14px;padding:15px 17px;font-size:12.5px;line-height:1.7;position:relative;}
  .record-box .tag{position:absolute;top:-9px;left:14px;background:var(--orange);color:#fff;font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:10px;}
  .doc-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 16px;margin-bottom:10px;}
  .doc-card .doc-tag{display:inline-block;font-size:10.5px;font-weight:800;color:var(--blue-deep);background:var(--blue-pale);padding:3px 9px;border-radius:10px;margin-bottom:8px;}
  .doc-card p.body{background:var(--bg);border-radius:10px;padding:11px 13px;font-size:12.5px;line-height:1.65;margin:0 0 8px;color:var(--ink);}
  .doc-card p.tip{margin:0;font-size:11.5px;color:var(--muted);}
  .doc-card p.tip b{color:var(--orange);}
  .tip-box{background:var(--orange-pale);border:1px solid #FADFB3;border-radius:14px;padding:13px 15px;font-size:12px;color:#8A4B00;margin-bottom:14px;}
  .interview-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 16px;margin-bottom:10px;}
  .interview-card .q2{font-weight:800;font-size:13.5px;color:var(--navy);margin-bottom:6px;}
  .interview-card .q2::before{content:"Q. ";color:var(--orange);}
  .interview-card .a2{font-size:12.5px;color:var(--ink);margin:0;}
  .track-card{display:flex;gap:10px;margin-bottom:10px;}
  .track-card .pctbox{flex:0 0 62px;height:62px;border-radius:14px;background:var(--blue-pale);color:var(--blue-deep);
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;}
  .track-card .txt h4{margin:0 0 3px;font-size:13.5px;color:var(--navy);}
  .track-card .txt p{margin:0;font-size:12px;color:var(--muted);}

  .diag-card{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--blue);
    border-radius:0 16px 16px 0;padding:16px 17px;margin-bottom:12px;}
  .diag-card .pair{display:flex;gap:6px;align-items:center;margin-bottom:8px;flex-wrap:wrap;}
  .diag-card .axis-tag{font-size:11px;font-weight:800;padding:4px 10px;border-radius:12px;}
  .axis-tag.p{background:var(--blue-pale);color:var(--blue-deep);}
  .axis-tag.a{background:#F1EAFB;color:#6A3FBF;}
  .axis-tag.s{background:var(--orange-pale);color:#C25E00;}
  .axis-tag.q{background:#E8F6EE;color:#1E8A5F;}
  .diag-card .vs{font-size:11px;color:var(--muted);font-weight:700;}
  .diag-card h4{margin:0 0 6px;font-size:14.5px;color:var(--navy);}
  .diag-card .sym{font-size:12.5px;color:var(--ink);margin:0 0 8px;padding:10px 12px;background:var(--bg);border-radius:10px;}
  .diag-card .sym b{color:#C0392B;}
  .diag-card .rx{font-size:12.5px;color:var(--ink);margin:0;}
  .diag-card .rx b{color:#1E8A5F;}
  .compare-table{width:100%;border-collapse:collapse;font-size:12px;}
  .compare-table th{background:var(--navy);color:#fff;padding:9px 8px;font-size:11.5px;text-align:left;}
  .compare-table td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top;}
  .compare-table td:first-child{font-weight:800;color:var(--navy);width:26%;}
  .symptom-check .check-item label b{color:var(--blue-deep);}
  .rx-methods{margin:0;padding:0;list-style:none;}
  .rx-methods li{display:flex;gap:8px;padding:8px 0;border-top:1px dashed var(--line);font-size:12.5px;color:var(--ink);}
  .rx-methods li:first-child{border-top:none;}
  .rx-methods .m-tag{flex:0 0 auto;width:22px;height:22px;border-radius:7px;background:var(--blue);color:#fff;
    font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;}
  .rx-methods b{display:block;color:var(--navy);margin-bottom:2px;}
  .mission-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 16px;margin-bottom:10px;position:relative;}
  .mission-card .diff{display:inline-block;font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:10px;margin-bottom:8px;}
  .diff.low{background:#E8F6EE;color:#1E8A5F;}
  .diff.mid{background:var(--blue-pale);color:var(--blue-deep);}
  .diff.high{background:#FDEAEA;color:#C0392B;}
  .mission-card h4{margin:0 0 5px;font-size:14px;color:var(--navy);}
  .mission-card p{margin:0 0 8px;font-size:12.5px;color:var(--ink);}
  .mission-card .xp{font-size:11px;font-weight:800;color:var(--orange);}
  .mission-card .link-skill{font-size:11px;color:var(--muted);}
  .interpret-band{display:flex;gap:8px;margin-top:14px;}
  .interpret-band .band{flex:1;text-align:center;border-radius:12px;padding:10px 6px;font-size:11px;}
  .band.low{background:#FDEAEA;color:#C0392B;}
  .band.mid{background:#FFF6E5;color:#B4740E;}
  .band.high{background:#E8F6EE;color:#1E8A5F;}
  .band b{display:block;font-size:15px;margin-bottom:2px;}
  .faq-item{border-bottom:1px solid var(--line);padding:13px 0;}
  .faq-item:last-child{border-bottom:none;}
  .faq-item .q{font-weight:800;font-size:13.5px;color:var(--navy);margin-bottom:5px;}
  .faq-item .q::before{content:"Q. ";color:var(--blue);}
  .faq-item .a{font-size:12.5px;color:var(--ink);margin:0;}
  @media print{
    header.top, nav.tabs, .lang-switch, .pdf-btn, .footer-cta{display:none !important;}
    body{padding-bottom:0;}
  }

  .cover{background:#F4F2FB;padding:28px 20px 26px;}
  .cover-inner{max-width:640px;margin:0 auto;}

  .cover-brand-row{display:flex;align-items:center;gap:9px;margin-bottom:16px;}
  .cover-badge{width:34px;height:34px;border-radius:9px;background:var(--blue-deep);color:#fff;
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex:0 0 auto;}
  .cover-brand-row .word{font-size:15px;font-weight:800;color:var(--navy);}

  .cover h1{font-size:23px;font-weight:800;margin:0 0 18px;color:var(--navy);line-height:1.35;}

  .cover-card{background:#fff;border-radius:16px;padding:18px 18px;margin-bottom:12px;
    box-shadow:0 1px 4px rgba(16,27,51,.05);}
  .cover-card h4{margin:0 0 10px;font-size:13.5px;color:var(--blue-deep);font-weight:800;}
  .cover-card ol{margin:0;padding-left:18px;font-size:12px;color:var(--ink);line-height:1.8;}

  .process-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
  .process-grid div{background:#fff;border-radius:12px;padding:12px 13px;font-size:11px;line-height:1.5;
    border-left:4px solid var(--blue);box-shadow:0 1px 4px rgba(16,27,51,.05);}
  .process-grid div.pg-sim{border-left-color:#1E8A5F;}
  .process-grid div.pg-suc{border-left-color:var(--orange);}
  .process-grid div.pg-att{border-left-color:#6A3FBF;}
  .process-grid b{display:block;font-size:12.5px;margin-bottom:3px;color:var(--navy);}
  .process-grid span{color:var(--muted);}

  .profile-card{background:#fff;border-radius:16px;padding:16px 18px;margin-bottom:12px;
    box-shadow:0 1px 4px rgba(16,27,51,.05);}
  .profile-card h3{margin:0 0 4px;font-size:18px;color:var(--navy);font-weight:800;}
  .profile-card p{margin:0;font-size:12.5px;color:var(--muted);}

  .id-dark-card{background:linear-gradient(155deg,var(--navy),var(--blue-deep));color:#fff;border-radius:16px;
    padding:18px 18px 16px;margin-bottom:16px;}
  .id-dark-card .id-row{display:flex;justify-content:space-between;align-items:center;
    font-size:10.5px;letter-spacing:.05em;opacity:.65;margin-bottom:12px;font-weight:700;}
  .id-dark-card .subtype{font-size:11.5px;opacity:.75;margin-bottom:3px;}
  .id-dark-card .typename{font-size:19px;font-weight:800;margin-bottom:12px;}
  .id-dark-card .chips{display:flex;flex-wrap:wrap;gap:6px;}
  .id-dark-card .chip{font-size:11px;background:rgba(255,255,255,.14);padding:4px 10px;border-radius:12px;font-weight:600;}

  .feature-row{display:flex;gap:14px;padding-top:16px;border-top:1px solid #E4DFF5;}
  .feature-row div{flex:1;font-size:10.5px;line-height:1.5;}
  .feature-row .ico{margin-bottom:6px;color:var(--orange);}
  .feature-row .ico svg{width:18px;height:18px;}
  .feature-row b{display:block;font-size:11.5px;margin-bottom:2px;color:var(--navy);}
  .feature-row span{color:var(--muted);}

  .about-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 17px;margin-bottom:12px;}
  .about-card h4{margin:0 0 8px;font-size:14px;color:var(--navy);}
  .about-card p{margin:0;font-size:12.5px;color:var(--ink);}
  .expert-quad{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;}
  .expert-quad div{background:var(--bg);border-radius:12px;padding:11px;font-size:11.5px;}

about: `
  <div class="eyebrow">15 · About the Test</div>
  <h2>About D-CAS</h2>
  <p class="sub">A digital cognitive assessment for teens and adults, based on PASS theory.</p>

  <div class="about-card">
    <h4>Theoretical Background</h4>
    <p>PASS theory is a cognitive-processing framework built on the work of Soviet neuropsychologist Alexander Luria and formalized by Das, Naglieri, and Kirby (1994). Rather than reducing intelligence to a single number (IQ), it reconceptualizes it as 4 interconnected cognitive processes — Planning, Attention, Simultaneous, and Successive processing. D-CAS measures fluid intelligence based on this theory.</p>
  </div>

  <div class="about-card">
    <h4>The 4 Cognitive Processes</h4>
    <p><b>Successive</b> — Integrating stimuli in a specific order, in a chain-like structure where each element links only to the one before it. Involved in organizing language sequentially and executing procedures step by step.<br><br>
    <b>Simultaneous</b> — Integrating scattered stimuli into one coherent whole, with strong spatial and logico-grammatical components. Involved in perceiving parts as a unified form and synthesizing complex relationships.<br><br>
    <b>Planning</b> — Deciding, selecting, applying, and evaluating in order to solve a problem. Includes goal-setting, strategy formation, self-monitoring, and impulse control.<br><br>
    <b>Attention</b> — Selectively focusing on specific stimuli, inhibiting responses to distracting ones, and sustaining that focus for as long as needed.</p>
  </div>

  <div class="about-card">
    <h4>Test Structure</h4>
    <p>D-CAS consists of a Full Scale score and 4 PASS subscales (Planning, Attention, Simultaneous, Successive). This report does not use peer-normed standardization data — results are based on the individual's item-accuracy rate. When the gap between subscales is large, interpreting the subscale profile is recommended over the Full Scale score — which is exactly why this report centers on the combination of the 4 domains, as in the "Efficiency Diagnosis" section, rather than a single number.</p>
    <div class="expert-quad">
      <div><span class="ico">🎯</span><b>Achievement prediction</b>Predicts likelihood of academic success/struggle from scale scores</div>
      <div><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polygon points="15,9 11,11 9,15 13,13" fill="currentColor" stroke="none"/></svg></span><b>Career aptitude</b>Diagnoses field/job fit based on the cognitive profile</div>
      <div><span class="ico">🧩</span><b>Efficiency diagnosis</b>Pinpoints the structural cause of stalled grades via axis combinations</div>
      <div><span class="ico">🌟</span><b>Giftedness & strengths</b>Surfaces strengths that traditional tests often miss</div>
    </div>
  </div>

  <div class="about-card">
    <h4>How This Differs from Traditional Intelligence/Aptitude Tests</h4>

let currentLang = 'ko';

let currentIndex = 0;

function buildTocHTML(){
  const labels = NAV[currentLang];
  const g = GROUP_LABEL[currentLang];
  let html = '';
  SECTION_IDS.forEach((id,i)=>{
    if(i===0) html += `<div class="toc-group-label">${g.essential}</div>`;
    if(i===ESSENTIAL_COUNT) html += `<div class="toc-group-label">${g.advanced}</div>`;
    const cur = i===currentIndex ? ' current' : '';
    html += `<button class="toc-item${cur}" data-idx="${i}"><span class="num">${i+1}</span><span class="label">${labels[i]}</span></button>`;
  });
  return html;
}

function renderToc(){
  const html = buildTocHTML();
  document.getElementById('tocList').innerHTML = html;
  document.getElementById('sidebarList').innerHTML = html;
  document.getElementById('tocTitle').textContent = TOC_TITLE[currentLang];
}

function render(){
  document.getElementById('t-brand').textContent = HEADER[currentLang].brand;
  document.getElementById('t-title').textContent = HEADER[currentLang].title;
  document.getElementById('t-meta').textContent = HEADER[currentLang].meta;
  document.getElementById('langLabel').textContent = HEADER[currentLang].lang;
  document.getElementById('pdfLabel').textContent = HEADER[currentLang].pdf;
  document.getElementById('t-footnote').textContent = HEADER[currentLang].foot;
  document.getElementById('coverArea').innerHTML = COVER[currentLang];
  document.documentElement.lang = currentLang;

  Object.keys(SECTIONS[currentLang]).forEach(key=>{
    document.getElementById(key).innerHTML = SECTIONS[currentLang][key];
  });

  renderToc();
  updateStepper();

  document.getElementById('opt-ko').classList.toggle('on', currentLang==='ko');
  document.getElementById('opt-en').classList.toggle('on', currentLang==='en');
}

function setLang(lang){
  currentLang = lang;
  render();
  document.getElementById('langMenu').classList.remove('open');
}

function updateStepper(){
  document.getElementById('stepCount').textContent = (currentIndex+1)+'/'+SECTION_IDS.length;
  document.getElementById('stepLabel').textContent = NAV[currentLang][currentIndex];
  document.getElementById('prevBtn').disabled = currentIndex===0;
  document.getElementById('nextBtn').disabled = currentIndex===SECTION_IDS.length-1;
}

function showSection(idx){
  if(idx<0 || idx>=SECTION_IDS.length) return;
  currentIndex = idx;
  document.querySelectorAll('#pdfArea > section').forEach(s=>s.classList.remove('active'));
  const target = document.getElementById(SECTION_IDS[idx]);
  if(target) target.classList.add('active');
  updateStepper();
  renderToc();
  closeToc();
  window.scrollTo({top:0, behavior:'smooth'});
}

function openToc(){ document.getElementById('tocOverlay').classList.add('open'); }
function closeToc(){ document.getElementById('tocOverlay').classList.remove('open'); }

document.getElementById('tocOpenBtn').addEventListener('click', openToc);
document.getElementById('tocCloseBtn').addEventListener('click', closeToc);
document.getElementById('tocOverlay').addEventListener('click', function(e){
  if(e.target.id==='tocOverlay') closeToc();
});
document.getElementById('prevBtn').addEventListener('click', ()=>showSection(currentIndex-1));
document.getElementById('nextBtn').addEventListener('click', ()=>showSection(currentIndex+1));

document.getElementById('tocList').addEventListener('click', function(e){
  const item = e.target.closest('.toc-item');
  if(!item) return;
  showSection(parseInt(item.dataset.idx,10));
});
document.getElementById('sidebarList').addEventListener('click', function(e){
  const item = e.target.closest('.toc-item');
  if(!item) return;
  showSection(parseInt(item.dataset.idx,10));
});

function downloadPdf(){
  const wrap = document.getElementById('reportRoot');
  const fname = (currentLang==='ko' ? '이지훈_D-CAS_결과지' : 'Jihoon-Lee_D-CAS_Report') + '.pdf';
  wrap.classList.add('pdf-mode');
  html2pdf().set({
    margin:10,
    filename:fname,
    image:{type:'jpeg', quality:0.98},
    html2canvas:{scale:2, useCORS:true},
    jsPDF:{unit:'mm', format:'a4', orientation:'portrait'},
    pagebreak:{mode:['css','legacy']}
  }).from(wrap).save().then(()=>{
    wrap.classList.remove('pdf-mode');
  }).catch(()=>{
    wrap.classList.remove('pdf-mode');
  });
}

document.addEventListener('click', function(e){
  if(!e.target.closest('.lang-switch')) document.getElementById('langMenu').classList.remove('open');
});

render();
</script>
</body>
</html>
