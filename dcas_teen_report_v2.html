<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이지훈 님의 D-CAS 결과지 · 청소년 진로적성 트랙</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
  :root{
    --blue:#2856D6; --blue-deep:#1B3B8C; --blue-pale:#EAF0FD;
    --orange:#F5820A; --orange-pale:#FFF1DF;
    --navy:#101B33; --ink:#1F2937; --muted:#5B6472;
    --bg:#F6F8FC; --card:#FFFFFF; --line:#E4E9F2;
    --radius:18px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",-apple-system,BlinkMacSystemFont,sans-serif;
    line-height:1.6;padding-bottom:80px;}

  /* ===== 헤더 / 언어 ===== */
  header.top{background:linear-gradient(135deg,var(--blue-deep),var(--blue));color:#fff;padding:16px 20px 14px;}
  .top-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  header.top .brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:13px;letter-spacing:.06em;opacity:.9;}
  header.top .brand .dot{width:7px;height:7px;border-radius:50%;background:var(--orange);}
  header.top h1{font-size:19px;margin:8px 0 2px;font-weight:800;}
  header.top .meta{font-size:13.5px;opacity:.85;}
  .top-actions{display:flex;flex-direction:column;gap:6px;align-items:flex-end;flex:0 0 auto;}
  .pdf-btn{background:var(--orange);color:#fff;border:none;border-radius:14px;padding:6px 13px;
    font-size:12.5px;font-weight:800;cursor:pointer;white-space:nowrap;}
  .lang-switch{position:relative;}
  .lang-btn{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.35);
    border-radius:14px;padding:6px 10px;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap;}
  .lang-menu{display:none;position:absolute;right:0;top:34px;background:#fff;border-radius:13px;
    box-shadow:0 8px 24px rgba(16,27,51,.18);overflow:hidden;min-width:140px;max-height:60vh;overflow-y:auto;z-index:40;}
  .lang-menu.open{display:block;}
  .lang-menu button{display:block;width:100%;text-align:left;padding:10px 15px;border:none;background:#fff;
    font-size:13.5px;color:var(--ink);cursor:pointer;font-weight:600;}
  .lang-menu button:hover{background:var(--blue-pale);}
  .lang-menu button.on{color:var(--blue);font-weight:800;background:var(--blue-pale);}
  .i18n-notice{background:#FFF6E5;border-bottom:1px solid #F3DFB0;color:#8A4B00;
    font-size:13px;padding:10px 18px;text-align:center;line-height:1.5;}
  .i18n-notice b{font-weight:800;}

  /* ===== 셸 / 내비게이션 ===== */
  .app-shell{display:flex;align-items:flex-start;}
  #sidebarNav{display:none;}
  #mainColumn{flex:1;min-width:0;}
  .stepper-bar{display:flex;align-items:center;gap:8px;padding:10px 14px;background:#fff;
    border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30;
    box-shadow:0 1px 6px rgba(16,27,51,.07);}
  .stepper-bar button{border:none;background:none;cursor:pointer;}
  .stepper-nav-btn{flex:0 0 auto;width:40px;height:40px;border-radius:50%;background:var(--blue-pale);
    color:var(--blue-deep);font-size:17px;font-weight:800;display:flex;align-items:center;justify-content:center;}
  .stepper-nav-btn:disabled{opacity:.32;background:var(--bg);color:var(--muted);}
  .stepper-toc-btn{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px;
    background:var(--blue-pale);color:var(--blue-deep);border-radius:13px;padding:7px 13px 8px;text-align:center;}
  .stepper-toc-top{display:flex;align-items:center;justify-content:center;gap:6px;min-width:0;}
  .stepper-toc-btn .step-label{font-size:14px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .stepper-toc-btn .count{color:var(--blue);opacity:.7;font-weight:700;font-size:12.5px;flex:0 0 auto;}
  .stepper-toc-btn svg{width:14px;height:14px;flex:0 0 auto;}
  .stepper-progress{display:block;height:3px;border-radius:2px;background:rgba(40,86,214,.15);overflow:hidden;}
  .stepper-progress-fill{display:block;height:100%;width:0%;background:var(--blue);border-radius:2px;transition:width .25s ease;}

  .toc-overlay{display:none;position:fixed;inset:0;z-index:50;background:rgba(16,27,51,.5);}
  .toc-overlay.open{display:flex;align-items:flex-end;}
  .toc-sheet{background:#fff;width:100%;max-height:78vh;border-radius:20px 20px 0 0;
    display:flex;flex-direction:column;animation:sheetUp .22s ease;}
  @keyframes sheetUp{from{transform:translateY(24px);opacity:.4;}to{transform:translateY(0);opacity:1;}}
  .toc-header{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 10px;
    border-bottom:1px solid var(--line);flex:0 0 auto;}
  .toc-header b{font-size:15px;color:var(--navy);}
  .toc-header button{border:none;background:var(--bg);width:38px;height:38px;border-radius:12px;
    font-size:15px;color:var(--muted);cursor:pointer;}
  .toc-list{overflow-y:auto;padding:8px 10px 20px;}
  .toc-group-label{font-size:12.5px;font-weight:800;color:var(--orange);padding:13px 10px 6px;letter-spacing:.03em;}
  .toc-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:none;background:none;
    padding:13px 10px;min-height:44px;border-radius:13px;font-size:13.5px;color:var(--ink);cursor:pointer;}
  .toc-item:active{background:var(--bg);}
  .toc-item .num{flex:0 0 auto;width:22px;height:22px;border-radius:7px;background:var(--bg);
    color:var(--muted);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;}
  .toc-item.current{background:var(--blue-pale);}
  .toc-item.current .num{background:var(--blue);color:#fff;}
  .toc-item.current span.label{color:var(--blue-deep);font-weight:800;}

  main{padding:22px 18px 10px;max-width:640px;margin:0 auto;}
  section{margin-bottom:34px;display:none;}
  section.active{display:block;}
  .pdf-mode section{display:block !important;}
  .pdf-mode .stepper-bar{display:none !important;}

  /* ===== 공통 컴포넌트 ===== */
  .eyebrow{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:800;
    color:var(--blue);background:var(--blue-pale);padding:5px 12px;border-radius:20px;margin-bottom:10px;}
  h2{font-size:20px;margin:0 0 6px;font-weight:800;color:var(--navy);}
  .sub{color:var(--muted);font-size:13px;margin:0 0 16px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px;margin-bottom:13px;box-shadow:0 1px 3px rgba(16,27,51,.04);}
  .foot-note{font-size:13px;color:var(--muted);text-align:center;margin-top:24px;}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  @media (max-width:360px){ .two-col{grid-template-columns:1fr;} }
  .mini{background:var(--bg);border-radius:14px;padding:13px;}
  .mini h4{margin:0 0 6px;font-size:13px;color:var(--blue-deep);}
  .mini p{margin:0;font-size:13px;color:var(--ink);}
  .table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -2px;}
  .table-scroll table{margin:0;}
  @media (max-width:480px){ .table-scroll table{min-width:480px;} }

  .hero-card{background:linear-gradient(150deg,var(--blue-deep) 0%,var(--blue) 55%,#3E6FE8 100%);
    color:#fff;border-radius:22px;padding:24px 20px;position:relative;overflow:hidden;}
  .hero-card::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;
    border-radius:50%;background:radial-gradient(circle,rgba(245,130,10,.35),transparent 70%);}
  .hero-tag{display:inline-block;background:rgba(255,255,255,.16);padding:4px 10px;border-radius:20px;
    font-size:13px;font-weight:700;margin-bottom:10px;}
  .hero-card h3{font-size:24px;margin:0 0 6px;font-weight:800;}
  .hero-card p{font-size:13px;opacity:.92;margin:0 0 14px;}
  .chips{display:flex;flex-wrap:wrap;gap:6px;}
  .chip{font-size:13px;background:rgba(255,255,255,.14);padding:5px 10px;border-radius:14px;font-weight:600;}

  .bar-row{display:flex;align-items:center;gap:10px;margin:10px 0;}
  .bar-label{width:78px;font-size:13px;font-weight:700;color:var(--navy);flex:0 0 auto;}
  .bar-track{flex:1;height:10px;background:var(--bg);border-radius:6px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--blue),#5C86EE);}
  .bar-fill.acc{background:linear-gradient(90deg,var(--orange),#FFA94D);}
  .bar-val{width:38px;text-align:right;font-size:13.5px;font-weight:800;color:var(--navy);}

  .radar-wrap{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:13px;text-align:center;}
  .radar-wrap svg{width:100%;max-width:260px;}
  .radar-legend{display:flex;justify-content:center;gap:14px;margin-top:8px;flex-wrap:wrap;}
  .radar-legend span{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:4px;}
  .radar-legend i{width:9px;height:9px;border-radius:50%;display:inline-block;}

  ol.steps{padding-left:0;list-style:none;counter-reset:step;margin:0;}
  ol.steps li{counter-increment:step;padding-left:38px;position:relative;margin-bottom:14px;font-size:13px;}
  ol.steps li::before{content:counter(step);position:absolute;left:0;top:0;width:26px;height:26px;
    border-radius:50%;background:var(--blue);color:#fff;font-weight:800;font-size:13.5px;
    display:flex;align-items:center;justify-content:center;}
  ol.steps li b{display:block;color:var(--navy);margin-bottom:2px;}

  .subject-table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px;}
  .subject-table th{text-align:left;color:var(--muted);font-weight:700;font-size:13px;padding:6px 4px;border-bottom:2px solid var(--line);}
  .subject-table td{padding:8px 4px;border-bottom:1px solid var(--line);vertical-align:top;}
  .compare-table{width:100%;border-collapse:collapse;font-size:13.5px;}
  .compare-table th{background:var(--navy);color:#fff;padding:9px 8px;font-size:13px;text-align:left;}
  .compare-table td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top;}
  .compare-table td:first-child{font-weight:800;color:var(--navy);width:26%;}
  table.matrix{width:100%;border-collapse:collapse;font-size:13px;}
  table.matrix th{background:var(--blue-pale);color:var(--blue-deep);padding:9px 6px;font-size:13px;}
  table.matrix td{padding:9px 6px;text-align:center;border-bottom:1px solid var(--line);}
  table.matrix td:first-child,table.matrix th:first-child{text-align:left;font-weight:700;color:var(--navy);}
  .pct{font-weight:800;} .pct.top{color:var(--orange);}
  .fit-bar-row{display:flex;align-items:center;gap:8px;}
  .fit-bar-track{flex:1;height:8px;background:var(--bg);border-radius:5px;overflow:hidden;min-width:50px;}
  .fit-bar-fill{height:100%;border-radius:5px;background:linear-gradient(90deg,var(--blue),#5C86EE);}
  .fit-bar-fill.top{background:linear-gradient(90deg,var(--orange),#FFA94D);}
  .raw-table{width:100%;border-collapse:collapse;font-size:13px;}
  .raw-table th{background:var(--navy);color:#fff;padding:9px 6px;font-size:12.5px;text-align:center;}
  .raw-table td{padding:9px 6px;text-align:center;border-bottom:1px solid var(--line);}
  .raw-table td:first-child{text-align:left;font-weight:800;color:var(--navy);}
  .raw-table .judge{font-size:12px;font-weight:700;padding:2px 7px;border-radius:8px;display:inline-block;}
  .judge.high{background:#E8F6EE;color:#1E8A5F;}
  .judge.mid{background:var(--blue-pale);color:var(--blue-deep);}
  .judge.low{background:#FDEAEA;color:#C0392B;}
  .test-info-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;}
  .test-info-row div{background:var(--bg);border-radius:13px;padding:12px;text-align:center;}
  .test-info-row b{display:block;font-size:16px;color:var(--navy);}
  .test-info-row span{font-size:12px;color:var(--muted);}

  .dept-card{border-left:4px solid var(--blue);padding:13px 14px;background:var(--bg);border-radius:0 13px 13px 0;margin-bottom:10px;}
  .dept-card .rank{font-size:12.5px;font-weight:800;color:var(--blue);}
  .dept-card h4{margin:2px 0 5px;font-size:15px;color:var(--navy);}
  .dept-card p{margin:0;font-size:13px;color:var(--ink);}
  .job-strip{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
  .job-pill{background:var(--orange-pale);color:#C25E00;font-size:13px;font-weight:700;padding:5px 12px;border-radius:14px;}

  .check-item{display:flex;gap:10px;align-items:flex-start;padding:13px 0;border-bottom:1px solid var(--line);cursor:pointer;}
  .check-item:last-child{border-bottom:none;}
  .check-item input{margin-top:2px;width:20px;height:20px;accent-color:var(--blue);flex:0 0 auto;cursor:pointer;}
  .check-item label{font-size:13px;color:var(--ink);display:block;padding:4px 0;cursor:pointer;}
  .check-item .scale{font-size:12.5px;color:var(--muted);display:block;margin-top:2px;}
  .interpret-band{display:flex;gap:8px;margin-top:14px;}
  .interpret-band .band{flex:1;text-align:center;border-radius:13px;padding:10px 6px;font-size:12.5px;}
  .band.low{background:#FDEAEA;color:#C0392B;}
  .band.mid{background:#FFF6E5;color:#B4740E;}
  .band.high{background:#E8F6EE;color:#1E8A5F;}
  .band b{display:block;font-size:15px;margin-bottom:2px;}

  .temp-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:13px;}
  .temp-card h4{margin:0 0 10px;font-size:14px;color:var(--navy);}
  .temp-block{font-size:13px;margin-bottom:8px;padding-left:4px;}
  .temp-block b{display:block;font-size:13.5px;margin-bottom:3px;}
  .temp-block.good b{color:#1E8A5F;}
  .temp-block.watch b{color:#C25E00;}
  .temp-block ul{margin:0;padding-left:16px;}
  .temp-block li{margin-bottom:2px;}

  .diag-card{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--blue);
    border-radius:0 16px 16px 0;padding:16px 17px;margin-bottom:13px;}
  .diag-card .pair{display:flex;gap:6px;align-items:center;margin-bottom:8px;flex-wrap:wrap;}
  .diag-card .axis-tag{font-size:12.5px;font-weight:800;padding:4px 10px;border-radius:13px;}
  .axis-tag.p{background:var(--blue-pale);color:var(--blue-deep);}
  .axis-tag.a{background:#F1EAFB;color:#6A3FBF;}
  .axis-tag.s{background:var(--orange-pale);color:#C25E00;}
  .axis-tag.q{background:#E8F6EE;color:#1E8A5F;}
  .diag-card .vs{font-size:12.5px;color:var(--muted);font-weight:700;}
  .diag-card h4{margin:0 0 6px;font-size:14.5px;color:var(--navy);}
  .diag-card .sym{font-size:13px;color:var(--ink);margin:0 0 8px;padding:10px 13px;background:var(--bg);border-radius:10px;}
  .diag-card .sym b{color:#C0392B;}
  .diag-card .rx{font-size:13px;color:var(--ink);margin:0;}
  .diag-card .rx b{color:#1E8A5F;}

  .combo-preview{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 17px;margin-bottom:14px;}
  .combo-preview h4{display:flex;align-items:center;margin:0 0 13px;font-size:13.5px;color:var(--navy);}
  .cp-row{display:flex;align-items:center;gap:9px;padding:9px 0;border-top:1px solid var(--line);flex-wrap:wrap;}
  .cp-row:first-of-type{border-top:none;}
  .cp-num{flex:0 0 auto;width:20px;height:20px;border-radius:6px;background:var(--navy);color:#fff;
    font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;}
  .cp-x{color:var(--muted);font-size:12.5px;font-weight:700;}
  .cp-desc{color:var(--muted);font-size:13px;margin-left:auto;text-align:right;}
  .combo-tag{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;
    background:var(--bg);border:1px dashed var(--blue);color:var(--blue-deep);border-radius:10px;padding:5px 10px;margin:8px 0 0;}

  .doc-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 16px;margin-bottom:10px;}
  .doc-card .doc-tag{display:inline-block;font-size:12px;font-weight:800;color:var(--blue-deep);
    background:var(--blue-pale);padding:3px 9px;border-radius:10px;margin-bottom:8px;}
  .doc-card p.body{background:var(--bg);border-radius:10px;padding:12px 13px;font-size:13px;line-height:1.65;margin:0 0 8px;color:var(--ink);}
  .doc-card p.tip{margin:0;font-size:13px;color:var(--muted);}
  .doc-card p.tip b{color:var(--orange);}
  .tip-box{background:var(--orange-pale);border:1px solid #FADFB3;border-radius:14px;padding:13px 15px;
    font-size:13.5px;color:#8A4B00;margin-bottom:14px;}
  .interview-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 16px;margin-bottom:10px;}
  .interview-card .q2{font-weight:800;font-size:13.5px;color:var(--navy);margin-bottom:6px;}
  .interview-card .q2::before{content:"Q. ";color:var(--orange);}
  .interview-card .a2{font-size:13px;color:var(--ink);margin:0;}
  .faq-item{border-bottom:1px solid var(--line);padding:13px 0;}
  .faq-item:last-child{border-bottom:none;}
  .faq-item .q{font-weight:800;font-size:13.5px;color:var(--navy);margin-bottom:5px;}
  .faq-item .q::before{content:"Q. ";color:var(--blue);}
  .faq-item .a{font-size:13px;color:var(--ink);margin:0;}

  .mission-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 16px;margin-bottom:10px;position:relative;}
  .mission-card .diff{display:inline-block;font-size:12px;font-weight:800;padding:3px 9px;border-radius:10px;margin-bottom:8px;}
  .diff.low{background:#E8F6EE;color:#1E8A5F;}
  .diff.mid{background:var(--blue-pale);color:var(--blue-deep);}
  .diff.high{background:#FDEAEA;color:#C0392B;}
  .mission-card h4{margin:0 0 5px;font-size:14px;color:var(--navy);}
  .mission-card p{margin:0 0 8px;font-size:13px;color:var(--ink);}
  .mission-card .xp{font-size:12.5px;font-weight:800;color:var(--orange);}
  .mission-card .link-skill{font-size:12.5px;color:var(--muted);}

  .hook-card{background:var(--navy);color:#fff;border-radius:18px;padding:18px 18px 16px;margin-bottom:16px;}
  .hook-card h4{margin:0 0 13px;font-size:14.5px;text-align:center;}
  .hook-q{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.14);font-size:13.5px;}
  .hook-q:last-of-type{border-bottom:none;}
  .hook-q .mark{flex:0 0 auto;width:20px;height:20px;border-radius:50%;background:var(--orange);
    display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:800;}
  .hook-cta{margin-top:13px;text-align:center;font-size:13.5px;color:#FFD9A0;font-weight:700;}
  .recommend-box{background:var(--blue-pale);border:1px solid #CBDBFA;border-radius:16px;padding:16px 17px;margin-bottom:16px;}
  .recommend-box h4{margin:0 0 10px;font-size:13.5px;color:var(--blue-deep);}
  .recommend-box ul{margin:0;padding:0;}
  .recommend-box li{font-size:13px;color:var(--ink);margin-bottom:7px;padding-left:22px;position:relative;list-style:none;}
  .recommend-box li::before{content:"✓";position:absolute;left:0;color:var(--blue);font-weight:800;}

  .anchor-card{background:linear-gradient(150deg,var(--navy) 0%,var(--blue-deep) 100%);color:#fff;
    border-radius:20px;padding:22px 20px;text-align:center;margin-bottom:16px;}
  .anchor-card .eyebrow{background:rgba(255,255,255,.14);color:#FFD9A0;}
  .anchor-card h3{font-size:18px;margin:8px 0 10px;font-weight:800;line-height:1.4;}
  .anchor-card .stat-row{display:flex;justify-content:center;gap:10px;margin:14px 0;}
  .anchor-card .stat-chip{background:rgba(255,255,255,.12);border-radius:13px;padding:8px 14px;}
  .anchor-card .stat-chip b{display:block;font-size:17px;color:var(--orange);}
  .anchor-card .stat-chip span{font-size:12px;opacity:.8;}
  .anchor-card p{margin:0;font-size:13.5px;opacity:.9;line-height:1.7;}
  .self-mission{background:var(--card);border:1.5px dashed var(--blue);border-radius:16px;padding:15px 16px;margin-bottom:10px;}
  .self-mission .sm-tag{display:inline-block;font-size:12px;font-weight:800;color:var(--blue-deep);

function reqTag(r, id){
  if(id && TAG_OVERRIDE[id]) return TAG_OVERRIDE[id];
  const s = r.slice().sort(function(a,b){ return b-a; });
  return r.map(function(v){ return v>=s[0]-3?3 : (v<=s[3]+3?1:2); });
}
const TAGLABEL = {ko:{3:'핵심',2:'보조',1:'무관'}, en:{3:'Core',2:'Support',1:'N/A'}};
const W_TAG = {3:3,2:1,1:0}, BAND = {3:[55,90], 2:[45,80]};
function tagScore(r,id){
  const T=reqTag(r,id); let w=0,s=0;
  AXK.forEach(function(k,i){ const ww=W_TAG[T[i]]; if(!ww) return;
    const bd=BAND[T[i]]; w+=ww; s+=ww*Math.max(0,Math.min(1,(ME[k]-bd[0])/(bd[1]-bd[0]))); });
  return w? s/w*100 : 50;
}
function detailScore(r){
  let w=0,meet=0,slack=0;
  AXK.forEach(function(k,i){ const R=r[i],M=ME[k]; if(R<=0) return; w+=R;
    meet+=R*Math.pow(Math.min(M/R,1),3); slack+=R*Math.max(0,Math.min((M-R)/30,1)); });
  return w? (meet/w*100)*0.85+(slack/w*100)*0.15 : 50;
}

const TOL = 3, NEAR = 15;
function tierOf(r,id){
  const T=reqTag(r,id); const short=[];
  AXK.forEach(function(k,i){ if(T[i]===3 && ME[k] < r[i]-TOL) short.push({k:k,i:i,gap:r[i]-ME[k]}); });
  short.sort(function(a,b){ return b.gap-a.gap; });
  let t;
  if(short.length===0) t=1;
  else if(short.length===1 && short[0].gap<=NEAR) t=2;
  else t=3;
  return {t:t, short:short};
}

about: `
  <div class="eyebrow">20 · About D-CAS</div>
  <h2>About D-CAS</h2>
  <p class="sub">A digital cognitive assessment for teens and adults, based on PASS theory.</p>

  <div class="about-card">
    <h4>Theoretical Background</h4>
    <p>PASS theory is a cognitive-processing framework built on the work of neuropsychologist Alexander Luria and formalized by Das, Naglieri, and Kirby (1994). Rather than reducing intelligence to a single number, it reconceptualizes it as 4 interconnected processes — Planning, Attention, Simultaneous, and Successive processing.</p>
  </div>

  <div class="about-card">
    <h4>The 4 Cognitive Processes</h4>
    <p><b>Successive</b> — Integrating stimuli in a specific order, chain-like, where each element links to the one before it.<br><br>
    <b>Simultaneous</b> — Integrating scattered stimuli into one coherent whole, with strong spatial and logico-grammatical components.<br><br>
    <b>Planning</b> — Deciding, selecting, applying, and evaluating to solve a problem. Includes goal-setting, strategy, self-monitoring, impulse control.<br><br>
    <b>Attention</b> — Selectively focusing, inhibiting distraction, and sustaining focus as long as needed.</p>
  </div>

  <h4 style="margin:22px 0 10px;font-size:15px;color:var(--navy);">🔍 How This Differs from Other Career Tests</h4>

    '<p class="sub" style="margin-bottom:10px;">'+(lang==='ko'
      ? '지금은 인지처리가 가장 크게 자라는 시기예요. <b>훈련으로 능력을 올리고, 학습법으로 부담을 줄이고, 미션으로 습관을 만드는</b> 세 갈래로 접근합니다.'
      : 'This is the age when cognitive processing grows most. Three routes: <b>train the ability, ease the load through study method, build the habit through missions.</b>')+'</p>'+
    targets.slice(0,2).map(function(k){
      const F=FIXPATH[k][lang];
      return '<div class="card"><h4 style="margin:0 0 10px;font-size:14px;color:var(--navy);">'+F.ax+' '+(lang==='ko'?'보완':'growth')+'</h4>'+
        '<div class="cp-row"><span class="cp-num">1</span><b style="color:var(--blue-deep);">'+(lang==='ko'?'훈련':'Train')+'</b>'+
        '<span class="cp-desc" style="margin-left:0;text-align:left;flex:1;">'+(lang==='ko'?'능력 자체를 올려요':'Raise the ability itself')+'</span></div>'+
        '<ul style="margin:4px 0 10px;padding-left:18px;font-size:13px;">'+F.train.map(function(x){return '<li>'+x+'</li>';}).join('')+'</ul>'+
        '<div class="cp-row"><span class="cp-num">2</span><b style="color:var(--blue-deep);">'+(lang==='ko'?'학습법':'Study method')+'</b>'+
        '<span class="cp-desc" style="margin-left:0;text-align:left;flex:1;">'+(lang==='ko'?'부담을 강점축으로 옮겨요':'Shift the load to your strong domain')+'</span></div>'+
        '<ul style="margin:4px 0 10px;padding-left:18px;font-size:13px;">'+F.study.map(function(x){return '<li>'+x+'</li>';}).join('')+'</ul>'+
        '<div class="cp-row"><span class="cp-num">3</span><b style="color:var(--blue-deep);">'+(lang==='ko'?'미션':'Mission')+'</b>'+
        '<span class="cp-desc" style="margin-left:0;text-align:left;flex:1;">'+(lang==='ko'?'습관으로 만들어요':'Turn it into a habit')+'</span></div>'+
        '<p style="margin:4px 0 0;font-size:13px;">'+F.mission+'</p></div>';
    }).join('');
  host.innerHTML=html;
}

/* ---- 11 하단 · 보완 시뮬레이션 ---- */
function renderSim(){
  const host=document.getElementById('simArea'); if(!host) return;
  const lang=L(), list=majorList(), mr=myAxisRank();
  /* 시뮬레이션은 '조금만 더하면 열리는 곳'이 가장 유용 — ②층 최상위를 우선 대상으로 */
  const cand = list.filter(function(m){ return m.tier.t===2; })[0]
            || list.filter(function(m){ return m.tier.t===3; })[0] || list[0];
  const top = cand;
  const ax = top.tier.short.length ? top.tier.short[0].k : mr[mr.length-1].k;
  const axName = FIXPATH[ax][lang].ax;
  const cur=tierOf(top.r,top.id).t;
  const curOpen=MAJORS.filter(function(x){ return tierOf(x.r,x.id).t===1; }).length;
  const rows=[5,10,15].map(function(d){
    const r=simulate(ax,d,MAJORS,top.id);
    const up = r.tier<cur ? ' <b style="color:#1E8A5F;">↑</b>' : '';
    const og = r.open>curOpen ? ' <b style="color:#1E8A5F;">+'+(r.open-curOpen)+'</b>' : '';
    return '<tr><td>+'+d+'p</td><td>'+r.val+'%</td><td>'+TIER[lang][r.tier].label+up+'</td>'+
           '<td>'+r.open+(lang==='ko'?'개':'')+og+'</td></tr>';
  }).join('');
  const noEffect = mr.filter(function(x){ return top.tier.short.every(function(s){ return s.k!==x.k; }); })
                     .map(function(x){ return AXN[lang][x.i]; }).slice(0,2);
  host.innerHTML='<h4 style="margin:22px 0 6px;font-size:15px;color:var(--navy);">'+
    (lang==='ko'?'키우면 무엇이 달라질까':'What changes if you grow it')+'</h4>'+
    '<p class="sub" style="margin-bottom:8px;">'+(lang==='ko'
      ? top[lang]+' 기준이에요. 훈련 기간은 사람마다 달라 적지 않고, <b>축이 얼마나 오르면 분류가 어떻게 바뀌고 선택지가 몇 개 늘어나는지</b>만 보여드려요.'
      : 'Based on '+top[lang]+'. Training time varies, so we show only <b>how the tier changes and how many options open up</b> as the domain rises.')+'</p>'+
    '<div class="card"><div class="table-scroll"><table class="rt-table">'+
    '<tr><th>'+axName+'</th><th>'+(lang==='ko'?'충족률':'Fit')+'</th><th>'+(lang==='ko'?'분류':'Tier')+'</th><th>'+(lang==='ko'?'①층 학과':'Tier ① majors')+'</th></tr>'+
    '<tr><td>'+(lang==='ko'?'현재':'now')+'</td><td>'+top.fit+'%</td><td>'+TIER[lang][cur].label+'</td>'+
    '<td>'+curOpen+(lang==='ko'?'개':'')+'</td></tr>'+rows+'</table></div>'+
    (noEffect.length? '<p class="sub" style="margin:10px 0 0;">'+noEffect.join('·')+(lang==='ko'
      ? josaT(noEffect[noEffect.length-1],'은','는')+' 이미 요구를 충족해서 더 올려도 이 결과는 달라지지 않아요. <b>지금 가장 효과가 큰 축은 '+axName+'입니다.</b>'
      : ' already meet the requirement, so raising them further changes nothing here. <b>The highest-leverage domain right now is '+axName+'.</b>')+'</p>':'')+
    '<p class="sub" style="margin:8px 0 0;">'+(lang==='ko'
      ? '변화는 12번 재검사에서 실제로 확인할 수 있어요.'
      : 'You can verify the change at the retest in section 12.')+'</p></div>';
}

/* ---- 18 신뢰도 / 15 재검사 ---- */
function renderReliability(){
  const host = document.getElementById('relArea'); if(!host) return;
  const r = REL[L()];
  host.innerHTML =
    '<h4 style="margin:22px 0 6px;font-size:15px;color:var(--navy);">'+r.title+'</h4>'+
    '<p class="sub" style="margin-bottom:8px;">'+r.sub+'</p>'+
    '<div class="table-scroll"><table class="raw-table"><tr>'+
    r.head.map(function(h){ return '<th>'+h+'</th>'; }).join('')+'</tr>'+
    r.rows.map(function(x){
      const cls = (x[3]==='주의'||x[3]==='Watch') ? 'low' : 'high';
      return '<tr><td>'+x[0]+'</td><td>'+x[1]+'</td><td>'+x[2]+'</td><td><span class="judge '+cls+'">'+x[3]+'</span></td></tr>';
    }).join('')+'</table></div>'+
    '<div class="card" style="margin-top:12px;"><p style="margin:0;font-size:13.5px;">'+r.note+'</p></div>';
}
function renderRetest(){
  const host = document.getElementById('retestArea'); if(!host) return;
  const r = REL[L()];
  host.innerHTML =
    '<h4 style="margin:22px 0 8px;font-size:15px;color:var(--navy);">'+r.rtTitle+'</h4>'+
    '<div class="card rt-demo"><p class="sub" style="margin:0 0 4px;">'+r.rtSub+'</p>'+
    '<div class="table-scroll"><table class="rt-table"><tr>'+
    r.rtHead.map(function(h){ return '<th>'+h+'</th>'; }).join('')+'</tr>'+
    r.rtRows.map(function(x){
      return '<tr><td>'+x[0]+'</td><td>'+x[1]+'</td><td>'+x[2]+'</td><td class="'+(x[4]?'rt-up':'rt-flat')+'">'+x[3]+'</td></tr>';
    }).join('')+'</table></div>'+
    '<p style="margin:10px 0 0;font-size:13.5px;">'+r.rtNote+'</p></div>';
}

/* ---- 전체 렌더 ---- */
function renderDynamic(){
  renderInterest(); renderSymptom();
  renderFieldTable(); renderFieldMatrix();
  renderDept(); renderFix(); renderSim();
  renderOpinionMix(); renderReliability(); renderRetest();
}
function render(){
  const H = HEADER[CL()];
  document.getElementById('t-brand').textContent = H.brand;
  document.getElementById('t-title').textContent = H.title;
  document.getElementById('t-meta').textContent = H.meta;
  document.getElementById('langLabel').textContent = langMeta().n;   /* 선택한 UI 언어명 그대로 */
  document.getElementById('pdfLabel').textContent = H.pdf;
  document.getElementById('t-footnote').textContent = H.foot;
  document.getElementById('coverArea').innerHTML = COVER[CL()];
  const meta = langMeta();
  document.documentElement.lang = currentLang;
  document.documentElement.dir = meta.rtl ? 'rtl' : 'ltr';
  renderLangMenu();
  renderNotice();
  SECTION_IDS.forEach(function(key){
    const el = document.getElementById(key);
    if(el && SECTIONS[CL()][key]) el.innerHTML = SECTIONS[CL()][key];
  });
  const cur = document.getElementById(SECTION_IDS[currentIndex]);
  if(cur) cur.classList.add('active');
  renderToc(); updateStepper(); renderDynamic();
}
function renderLangMenu(){
  document.getElementById('langMenu').innerHTML = LANGS.map(function(x){
    return '<button data-lang="'+x.c+'"'+(x.c===currentLang?' class="on"':'')+'>'+x.n+'</button>';
  }).join('');
}
function renderNotice(){
  const bar = document.getElementById('i18nNotice');
  if(!bar) return;
  if(READY.indexOf(currentLang)>-1){ bar.style.display='none'; bar.innerHTML=''; return; }
  bar.style.display='';
  bar.innerHTML = '<b>'+langMeta().n+'</b> — '+(NOTICE[currentLang]||NOTICE.en);
}
function setLang(lang){
  currentLang = lang;
  render();
  document.getElementById('langMenu').classList.remove('open');
}

/* ---- 이벤트 (위임) ---- */
document.addEventListener('click', function(e){
  const langOpt = e.target.closest ? e.target.closest('[data-lang]') : null;
  if(langOpt){ setLang(langOpt.dataset.lang); return; }
  if(e.target.id==='langBtn' || (e.target.closest && e.target.closest('#langBtn'))){
    document.getElementById('langMenu').classList.toggle('open'); return;
  }
  if(!(e.target.closest && e.target.closest('.lang-switch'))){
    document.getElementById('langMenu').classList.remove('open');
  }
  const item = e.target.closest ? e.target.closest('.toc-item') : null;
  if(item){ showSection(parseInt(item.dataset.idx,10)); return; }
  if(e.target.id==='tocOpenBtn' || (e.target.closest && e.target.closest('#tocOpenBtn'))){ openToc(); return; }
  if(e.target.id==='tocCloseBtn'){ closeToc(); return; }
  if(e.target.id==='tocOverlay'){ closeToc(); return; }
  if(e.target.id==='prevBtn'){ showSection(currentIndex-1); return; }
  if(e.target.id==='nextBtn'){ showSection(currentIndex+1); return; }
  if(e.target.id==='pdfBtn' || (e.target.closest && e.target.closest('#pdfBtn'))){ downloadPdf(); return; }
});
document.addEventListener('change', function(e){
  if(e.target.className==='iq-box'){
    ANS[parseInt(e.target.dataset.i,10)] = e.target.checked;
    renderInterest(); renderFieldMatrix(); renderOpinionMix(); return;
  }
  if(e.target.className==='sym-box'){
    SYMANS[parseInt(e.target.dataset.i,10)] = e.target.checked;
    renderSymptom(); return;
  }
});

/* ---- 스와이프 (모바일) ---- */
(function(){
  let sx=0, sy=0, active=false;
  const area = document.getElementById('pdfArea'); if(!area) return;
  area.addEventListener('touchstart', function(e){
    if(e.touches.length!==1) return;
    sx = e.touches[0].clientX; sy = e.touches[0].clientY; active = true;
  }, {passive:true});
  area.addEventListener('touchend', function(e){
    if(!active) return; active = false;
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    if(Math.abs(dx) > 56 && Math.abs(dx) > Math.abs(dy)*1.4){
      if(dx < 0) showSection(currentIndex+1); else showSection(currentIndex-1);
    }
  }, {passive:true});
})();



function downloadPdf(){
  const wrap = document.getElementById('reportRoot');
  const fname = (currentLang==='ko' ? '이지훈_D-CAS_결과지' : 'Jihoon-Lee_D-CAS_Report') + '.pdf';
  wrap.classList.add('pdf-mode');
  html2pdf().set({
    margin:10, filename:fname,
    image:{type:'jpeg', quality:0.98},
    html2canvas:{scale:2, useCORS:true},
    jsPDF:{unit:'mm', format:'a4', orientation:'portrait'},
    pagebreak:{mode:['css','legacy']}
  }).from(wrap).save().then(function(){wrap.classList.remove('pdf-mode');})
   .catch(function(){wrap.classList.remove('pdf-mode');});
}

render();
</script>
