kind = "web"
previewPath = "/"
title = "D-CAS ENTERPRISE LABS | 인사담당자 채용 실무 가이드"
description = "회사 기준 준비부터 직원 평가 반영, 지원자 연결, 면접 준비, 면접·과제 평가 및 비교·결정까지 안내하는 짧은 6단계 인사 실무 전자책."
version = "1.0.0"
id = "artifacts/dcas-quick-guide"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21888

[services.development]
run = "pnpm --filter @workspace/dcas-quick-guide run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/dcas-quick-guide", "run", "build" ]
serve = "static"
publicDir = "artifacts/dcas-quick-guide/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21888"
BASE_PATH = "/"
