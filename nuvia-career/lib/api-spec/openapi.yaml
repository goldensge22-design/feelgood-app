openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /career/lab-search:
    post:
      operationId: searchCareerLab
      description: Signed-in, opt-in search for public company and job sources; never accepts assessment or activity data.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CareerLabQuery"
      responses:
        "202":
          description: Existing or newly accepted LAB search
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerLabJob"
        "400":
          description: Invalid input
        "401":
          description: Authentication required
        "429":
          description: Rate or capacity limit
        "503":
          description: Search provider unavailable
        "502":
          description: Unverified or failed provider response
        "504":
          description: Provider timeout
  /career/lab-search/{id}:
    get:
      operationId: getCareerLabJob
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Status of a search owned by the signed-in user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerLabJob"
        "401":
          description: Authentication required
        "404":
          description: Search expired or not accessible
  /career/original-enterprise:
    get:
      operationId: getOriginalEnterprise
      description: Authenticated read of the original Enterprise LAB's reference catalogue; not a live vacancy feed.
      responses:
        "200":
          description: Reference organizations and roles with source citations
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    post:
      operationId: previewOriginalEnterpriseScenario
      description: Generate an original rule-based practice preview for a signed-in account; does not record execution or call AI.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OriginalEnterpriseScenarioRequest"
      responses:
        "200":
          description: Original scenario document
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /career/overview:
    get:
      operationId: getCareerOverview
      responses:
        "200":
          description: Public integration readiness and source-labelled common criteria
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerOverview"
  /career/review-story:
    post:
      operationId: startReviewStory
      description: Authenticated, explicitly consented writing help for selected review material. No account workspace or database writes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewStoryInput"
      responses:
        "202":
          description: Accepted or reused writing request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewStoryJob"
  /career/review-story/{id}:
    get:
      operationId: getReviewStory
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Status of the signed-in user's writing request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewStoryJob"
  /career/example:
    get:
      operationId: getCareerExample
      responses:
        "200":
          description: Fictional example, never personal test data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerState"
  /career/workspace:
    get:
      operationId: getCareerWorkspace
      responses:
        "200":
          description: Authenticated user's state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerWorkspace"
        "401":
          description: Authentication required
    put:
      operationId: saveCareerWorkspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CareerStateInput"
      responses:
        "200":
          description: Atomically saved state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerWorkspace"
        "409":
          description: Revision conflict; local edits must be retained
        "401":
          description: Authentication required
  /career/versions:
    get:
      operationId: getCareerVersions
      responses:
        "200":
          description: Owned immutable snapshots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CareerVersion"
    post:
      operationId: createCareerVersion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CareerVersionInput"
      responses:
        "201":
          description: Immutable snapshot of the saved application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerVersion"
        "409":
          description: Save the draft first
  /career/export:
    post:
      operationId: exportCareerDocument
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CareerExportInput"
      responses:
        "200":
          description: Actual DOCX file or plain text, never renamed HTML
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "422":
          description: Fact confirmation required or unsupported format
  /career/ai-assist:
    post:
      operationId: requestCareerAiAssistance
      summary: Generate consented, account-scoped writing assistance
      description: Uses only explicitly selected fields. Account-bound encrypted results are reused for up to five hours in shared PostgreSQL. Durable HMAC-keyed dispatch records and shared limits prevent automatic duplicate generation across workers and restarts. Uncertain dispatches are not automatically reclaimed. No plaintext prompts or originals are stored in coordination tables.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CareerAiAssistInput"
      responses:
        "200":
          description: AI-generated questions, candidate wording, feedback, or voice-rule suggestions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerAiAssistResponse"
        "400":
          description: Invalid or over-sized request
        "401":
          description: Authentication required
        "409":
          description: The user's consent confirmation is missing
        "429":
          description: AI_LOCAL_LIMIT or AI_CLASS_LIMIT (app limits), AI_PROVIDER_BUSY (transient provider rate), AI_USAGE_LIMIT (provider quota or billing); Retry-After header when known.
        "503":
          description: AI_NOT_CONFIGURED, AI_MODEL_CONFIG, AI_QUEUE_FULL, or AI_COORDINATION_UNAVAILABLE. DB/configuration failures never fall back to uncoordinated generation. Writing and saving remain available. A 409 AI_COORDINATION_WAIT retains the request for status recheck; 410 AI_RESULT_EXPIRED does not authorize regeneration.
        "413":
          description: AI_INPUT_LIMIT or REQUEST_TOO_LARGE. Select less context; original records are unchanged.
        "504":
          description: AI_UNCERTAIN or AI_TIMEOUT. No automatic timeout retry; identical ambiguous requests are held to prevent repeat charges.
  /career/ai-jobs:
    post:
      operationId: createCareerAiJob
      summary: Accept consented AI work without holding a long HTTP connection
      parameters:
        - in: header
          name: X-Career-AI-Client
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CareerAiAssistInput"
      responses:
        "202":
          description: Accepted or reused, no automatic duplicate generation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerAiJobStatus"
        "401":
          description: Authentication required
        "409":
          description: Consent or facts confirmation required
        "429":
          description: Shared admission limit
        "503":
          description: Coordination unavailable; no uncoordinated fallback
  /career/ai-jobs/by-client/{clientId}:
    get:
      operationId: getCareerAiJobByClient
      summary: Recover an accepted request even if its acknowledgement was lost
      parameters:
        - in: path
          name: clientId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Authenticated owner's accepted job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerAiJobStatus"
        "404":
          description: No matching accepted job for this owner
  /career/ai-jobs/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          pattern: "^[a-f0-9]{64}$"
    get:
      operationId: getCareerAiJob
      summary: Read only the authenticated owner's accepted job
      responses:
        "200":
          description: Queued/running is normal progress; poll automatically
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerAiJobStatus"
        "401":
          description: Authentication required
        "404":
          description: Unknown or another owner's job
        "503":
          description: Temporary coordination outage; retain ticket and reconnect
    delete:
      operationId: cancelCareerAiJob
      summary: Cancel undispatched work; dispatched work may still be billed and finish
      responses:
        "200":
          description: Current state, never automatically regenerates a dispatched job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerAiJobStatus"
        "401":
          description: Authentication required
        "404":
          description: Unknown or another owner's job
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    CareerLabQuery:
      type: object
      additionalProperties: false
      required: [company, job]
      properties:
        company: { type: string, maxLength: 100 }
        job: { type: string, maxLength: 100 }
        url: { type: string, maxLength: 500 }
    ReviewStoryEvidence:
      type: object
      additionalProperties: false
      required: [id, kind, title, text]
      properties:
        id: { type: string, pattern: '^[ARC][1-9]$' }
        kind: { type: string, enum: [activity, reflection, report, company] }
        title: { type: string, minLength: 1, maxLength: 180 }
        text: { type: string, minLength: 1, maxLength: 1200 }
    ReviewStoryInput:
      type: object
      additionalProperties: false
      required: [kind, consent, evidence, body, thought]
      properties:
        kind: { type: string, enum: [generate, refine] }
        consent: { type: boolean }
        evidence:
          type: array
          minItems: 1
          maxItems: 6
          items:
            $ref: "#/components/schemas/ReviewStoryEvidence"
        body: { type: string, maxLength: 10000 }
        thought: { type: string, maxLength: 500 }
    ReviewStorySuggestion:
      type: object
      required: [text, connection, used, missing]
      properties:
        text: { type: string, maxLength: 900 }
        connection: { type: string, maxLength: 350 }
        used:
          type: array
          maxItems: 6
          items: { type: string }
        missing: { type: string, maxLength: 220 }
    ReviewStoryJob:
      type: object
      required: [id, state]
      properties:
        id: { type: string }
        state: { type: string, enum: [pending, completed, failed] }
        error: { type: string }
        result:
          $ref: "#/components/schemas/ReviewStorySuggestion"
    CareerLabEvidence:
      type: object
      required: [id, category, keyword, excerpt, url, source, kind]
      properties:
        id: { type: string }
        category: { type: string, enum: [overview, philosophy, values, talent, environment, duties, required, preferred, skills] }
        keyword: { type: string }
        keywordOrigin:
          type: string
          enum: [official_named, ai_interpretation]
          description: Absent on legacy or curated evidence. AI summaries are not officially named company values.
        sourceSection:
          type: string
          description: Section label copied from the source when available.
        excerpt: { type: string }
        url: { type: string }
        source: { type: string }
        kind: { type: string, enum: [company, role, posting] }
    CareerLabMaterial:
      type: object
      required: [id, company, job, evidence]
      properties:
        id: { type: string }
        company: { type: string }
        job: { type: string }
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/CareerLabEvidence"
    CareerLabResults:
      type: object
      required: [mode, retrievedAt, version, materials]
      properties:
        mode: { type: string, enum: [gpt-web, curated] }
        retrievedAt: { type: string }
        version: { type: string }
        materials:
          type: array
          items:
            $ref: "#/components/schemas/CareerLabMaterial"
    CareerLabJob:
      type: object
      required: [id, state]
      properties:
        id: { type: string }
        state: { type: string, enum: [pending, completed, failed] }
        error: { type: string }
        result:
          $ref: "#/components/schemas/CareerLabResults"
    CareerAiJobStatus:
      type: object
      required: [id, state, pollAfterMs, elapsedMs, queuedMs]
      properties:
        id:
          type: string
        state:
          type: string
          enum: [queued, running, complete, failed, uncertain, cancelled]
        pollAfterMs:
          type: integer
        elapsedMs:
          type: number
        queuedMs:
          type: number
        response:
          $ref: "#/components/schemas/CareerAiAssistResponse"
        error:
          type: string
    CareerOverview:
      type: object
      required: [criteria, integrations]
      properties:
        criteria:
          type: array
          items:
            $ref: "#/components/schemas/CareerCriterion"
        integrations:
          type: array
          items:
            $ref: "#/components/schemas/CareerIntegration"
    CareerIntegration:
      type: object
      required: [id, status, requirements]
      properties:
        id:
          type: string
          enum: [dcas, planner, company]
        status:
          type: string
          enum: [unconnected, no_data, failed, expired, forbidden, connected]
        returnUrl:
          type: string
        requirements:
          type: array
          items: { type: string }
    CareerCriterion:
      type: object
      required: [id, title, description, sourceType, sourceLabel, asOf, version]
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string }
        sourceType:
          type: string
          enum: [common_example, official_ncs, report, job_posting, company_public]
        sourceLabel: { type: string }
        sourceUrl: { type: string }
        asOf: { type: string }
        version: { type: string }
    CareerState:
      type: object
      required: [selectedJob, experiences, activities, applications, criteria, report]
      properties:
        selectedJob: { type: string, maxLength: 500 }
        integrated:
          $ref: "#/components/schemas/CareerIntegratedWorkspace"
        report:
          type: [object, "null"]
          additionalProperties: true
        criteria:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/CareerCriterion"
        experiences:
          type: array
          maxItems: 500
          items:
            $ref: "#/components/schemas/CareerExperience"
        activities:
          type: array
          maxItems: 500
          items:
            $ref: "#/components/schemas/CareerActivity"
        applications:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/CareerApplication"
    CareerIntegratedWorkspace:
      type: object
      properties:
        audience: { type: string, enum: [youth, adult] }
        youthStoryId: { type: string, maxLength: 100 }
        adultStoryId: { type: string, maxLength: 100 }
        youthInterest: { type: string, maxLength: 300 }
        recoveredYouthInterests:
          type: array
          maxItems: 50
          items: { type: string, maxLength: 300 }
        companySource:
          $ref: "#/components/schemas/CareerIntegratedSource"
        recoveredCompanySources:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/CareerIntegratedSource" }
        planner: { type: string, maxLength: 700000 }
        plannerRecovery: { type: string, maxLength: 700000 }
        youthLab: { type: string, maxLength: 460000 }
        youthLabRecovery: { type: string, maxLength: 460000 }
        labHandoffs:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/CareerLabHandoff" }
    OriginalEnterpriseScenarioRequest:
      type: object
      additionalProperties: true
    CareerLabHandoff:
      type: object
      required: [id, audience, sourceId, sourceVersion, title, excerpt, keyword, purpose, approvedAt]
      properties:
        id: { type: string, minLength: 5, maxLength: 100 }
        audience: { type: string, enum: [youth, adult] }
        sourceId: { type: string, minLength: 1, maxLength: 180 }
        sourceVersion: { type: string, minLength: 1, maxLength: 180 }
        title: { type: string, minLength: 1, maxLength: 150 }
        excerpt: { type: string, minLength: 1, maxLength: 1200 }
        keyword: { type: string, maxLength: 300 }
        purpose: { type: string, enum: [exploration, simulation] }
        company: { type: string, maxLength: 180 }
        job: { type: string, maxLength: 180 }
        sourceSnapshot: { type: string, maxLength: 26000 }
        url: { type: string, maxLength: 2000 }
        approvedAt: { type: string, maxLength: 64 }
        revokedAt: { type: string, maxLength: 64 }
        plannerCardId: { type: string, maxLength: 100 }
    CareerIntegratedSource:
      type: object
      required: [company, job, keyword, excerpt, url, observedAt]
      properties:
        company: { type: string, maxLength: 300 }
        job: { type: string, maxLength: 300 }
        keyword: { type: string, maxLength: 300 }
        excerpt: { type: string, maxLength: 1200 }
        url: { type: string, maxLength: 2000 }
        observedAt: { type: string, maxLength: 80 }
    CareerExperience:
      type: object
      required: [id, title, action, result, learning, strengths, criterionIds, confirmed, source]
      properties:
        id: { type: string, maxLength: 100 }
        title: { type: string, maxLength: 500 }
        action: { type: string, maxLength: 20000 }
        result: { type: string, maxLength: 20000 }
        learning: { type: string, maxLength: 20000 }
        strengths:
          type: array
          items: { type: string }
        criterionIds:
          type: array
          items: { type: string }
        confirmed: { type: boolean }
        source:
          type: string
          enum: [manual, local_activity, planner, example]
        sourceId: { type: string }
        sourceUrl: { type: string }
        sourceVersion: { type: string }
        activityContext:
          type: string
          enum: [self_reported, thought_exercise]
        plannerReference: { type: string, maxLength: 160 }
        permissionStatus:
          type: string
          enum: [current, changed, deleted, revoked, unverified]
    CareerActivity:
      type: object
      required: [id, title, goal, steps, date, completion, evidence, strengths, criterionId, status, action, changed, result, learning]
      properties:
        id: { type: string, maxLength: 100 }
        title: { type: string, maxLength: 500 }
        goal: { type: string, maxLength: 5000 }
        steps: { type: string, maxLength: 10000 }
        date: { type: string, maxLength: 40 }
        completion: { type: string, maxLength: 5000 }
        evidence: { type: string, maxLength: 10000 }
        strengths:
          type: array
          items: { type: string }
        criterionId: { type: string }
        status:
          type: string
          enum: [planned, active, paused, partial, completed]
        action: { type: string, maxLength: 20000 }
        changed: { type: string, maxLength: 20000 }
        result: { type: string, maxLength: 20000 }
        learning: { type: string, maxLength: 20000 }
    CareerApplication:
      type: object
      required: [id, company, job, question, limit, countSpaces, writingLanguage, experienceIds, criterionIds, text]
      properties:
        id: { type: string, maxLength: 100 }
        company: { type: string, maxLength: 500 }
        job: { type: string, maxLength: 500 }
        question: { type: string, maxLength: 20000 }
        limit: { type: integer, minimum: 0, maximum: 100000 }
        countSpaces: { type: boolean }
        writingLanguage: { type: string, maxLength: 100 }
        experienceIds:
          type: array
          items: { type: string }
        criterionIds:
          type: array
          items: { type: string }
        text: { type: string, maxLength: 100000 }
        integratedThought: { type: string, maxLength: 5000 }
        integratedAudience: { type: string, enum: [youth, adult] }
        integratedEvidence:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 1000 }
    CareerWorkspace:
      type: object
      required: [revision, state, savedAt]
      properties:
        revision: { type: integer }
        state:
          $ref: "#/components/schemas/CareerState"
        savedAt: { type: string }
    CareerStateInput:
      type: object
      required: [revision, state]
      properties:
        revision: { type: integer, minimum: 0 }
        state:
          $ref: "#/components/schemas/CareerState"
    CareerVersionInput:
      type: object
      required: [applicationId, revision, label, submitted, requestId]
      properties:
        applicationId: { type: string }
        revision: { type: integer }
        label: { type: string, maxLength: 500 }
        submitted: { type: boolean }
        requestId: { type: string, maxLength: 100 }
    CareerVersion:
      type: object
      required: [id, label, submitted, createdAt, application, criteria]
      properties:
        id: { type: string }
        label: { type: string }
        submitted: { type: boolean }
        createdAt: { type: string }
        application:
          $ref: "#/components/schemas/CareerApplication"
        criteria:
          type: array
          items:
            $ref: "#/components/schemas/CareerCriterion"
    CareerExportInput:
      type: object
      required: [company, job, question, text, format, confirmed]
      properties:
        company: { type: string, maxLength: 500 }
        job: { type: string, maxLength: 500 }
        question: { type: string, maxLength: 20000 }
        text: { type: string, maxLength: 100000 }
        format:
          type: string
          enum: [txt, docx, hwpx]
        confirmed: { type: boolean }
    CareerAiAssistInput:
      type: object
      additionalProperties: false
      required: [task, locale, writingLanguage, sourceFingerprint, confirmed, factsConfirmed, coachPrompt, application, strengths, experiences, userAnswers, voiceSources, voiceRules]
      properties:
        task:
          type: string
          enum: [coach, draft, voice, analyze]
        locale: { type: string, maxLength: 20 }
        writingLanguage: { type: string, maxLength: 100 }
        sourceFingerprint: { type: string, minLength: 1, maxLength: 200 }
        confirmed: { type: boolean }
        factsConfirmed: { type: boolean }
        coachPrompt: { type: string, maxLength: 2000 }
        application:
          type: object
          additionalProperties: false
          required: [company, job, question, body]
          properties:
            company: { type: string, maxLength: 500 }
            job: { type: string, maxLength: 500 }
            question: { type: string, maxLength: 5000 }
            body: { type: string, maxLength: 20000 }
        strengths:
          type: array
          maxItems: 4
          items:
            type: object
            additionalProperties: false
            required: [name, interpretation, recommendationReason]
            properties:
              name: { type: string, maxLength: 200 }
              interpretation: { type: string, maxLength: 2000 }
              recommendationReason: { type: string, maxLength: 2000 }
        experiences:
          type: array
          maxItems: 10
          items:
            type: object
            additionalProperties: false
            required: [title, nature, context, cardType, source, sourceVersion, sourceTitle, fields, jobConnection]
            properties:
              title: { type: string, maxLength: 500 }
              nature:
                type: string
                enum: [actual, simulation, unconfirmed]
              context:
                type: string
                enum: [daily_activity, class_simulation, job_experience, synthetic_example, unknown]
              cardType:
                type: [string, "null"]
                enum: [daily_application, job_scenario, null]
              source: { type: string, maxLength: 100 }
              sourceVersion: { type: string, maxLength: 200 }
              sourceTitle: { type: string, maxLength: 500 }
              jobConnection:
                type: [object, "null"]
                additionalProperties: false
                required: [sourceKind, sourceTitle, sourceCompany, sourceJob, sourceVersion, sourceAsOf, specificDuty, sharedAction, learnedPrinciple, futureApplication, reviewed]
                properties:
                  sourceKind:
                    type: string
                    enum: [official_material, job_posting, company_public, educational_inference, unverified]
                  sourceTitle: { type: string, maxLength: 500 }
                  sourceCompany: { type: string, maxLength: 500 }
                  sourceJob: { type: string, maxLength: 500 }
                  sourceVersion: { type: string, maxLength: 200 }
                  sourceAsOf: { type: string, maxLength: 100 }
                  specificDuty: { type: string, maxLength: 2000 }
                  sharedAction: { type: string, maxLength: 2000 }
                  learnedPrinciple: { type: string, maxLength: 2000 }
                  futureApplication: { type: string, maxLength: 2000 }
                  reviewed: { type: boolean }
              fields:
                type: object
                additionalProperties: false
                required: [situation, roleGoal, action, selectionReason, changed, result, learning, resultEvidence, supportProvided, independentSteps]
                properties:
                  situation: { type: string, maxLength: 3000 }
                  roleGoal: { type: string, maxLength: 3000 }
                  action: { type: string, maxLength: 5000 }
                  selectionReason: { type: string, maxLength: 3000 }
