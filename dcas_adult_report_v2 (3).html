<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>박준서 님의 D-CAS 결과지 · 성인 진로직무 트랙</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
  :root{
    --blue:#2856D6; --blue-deep:#1B3B8C; --blue-pale:#EAF0FD;
    --orange:#F5820A; --orange-pale:#FFF1DF;
    --navy:#101B33; --ink:#1F2937; --muted:#6B7280;
    --bg:#F6F8FC; --card:#FFFFFF; --line:#E4E9F2;
    --radius:18px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",-apple-system,BlinkMacSystemFont,sans-serif;
    line-height:1.6; padding-bottom:80px;}
  header.top{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,var(--blue-deep),var(--blue));
    color:#fff;padding:16px 20px 14px;}
  .top-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  header.top .brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:13px;letter-spacing:.06em;opacity:.9;}
  header.top .brand .dot{width:7px;height:7px;border-radius:50%;background:var(--orange);}
  header.top h1{font-size:19px;margin:8px 0 2px;font-weight:800;}
  header.top .meta{font-size:12.5px;opacity:.85;}
  .top-actions{display:flex;flex-direction:column;gap:6px;align-items:flex-end;flex:0 0 auto;}
  .pdf-btn{background:var(--orange);color:#fff;border:none;border-radius:14px;padding:6px 12px;
    font-size:11.5px;font-weight:800;cursor:pointer;white-space:nowrap;}

  .app-shell{display:flex;align-items:flex-start;}
  #sidebarNav{display:none;}
  #mainColumn{flex:1;min-width:0;}

  .stepper-bar{display:flex;align-items:center;gap:8px;padding:10px 14px;background:#fff;
    border-bottom:1px solid var(--line);position:sticky;top:84px;z-index:19;}
  .stepper-bar button{border:none;background:none;cursor:pointer;}
  .stepper-nav-btn{flex:0 0 auto;width:34px;height:34px;border-radius:10px;background:var(--bg);
    color:var(--navy);font-size:16px;font-weight:800;display:flex;align-items:center;justify-content:center;}
  .stepper-nav-btn:disabled{opacity:.35;cursor:default;}
  .stepper-toc-btn{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:8px;
    background:var(--blue-pale);color:var(--blue-deep);border-radius:10px;padding:9px 10px;
    font-size:12.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .stepper-toc-btn .count{color:var(--muted);font-weight:700;}
  .stepper-toc-btn svg{width:14px;height:14px;flex:0 0 auto;}

  .toc-overlay{display:none;position:fixed;inset:0;z-index:40;background:rgba(16,27,51,.5);}
  .toc-overlay.open{display:flex;align-items:flex-end;}
  .toc-sheet{background:#fff;width:100%;max-height:78vh;border-radius:20px 20px 0 0;
    display:flex;flex-direction:column;animation:sheetUp .22s ease;}
  @keyframes sheetUp{from{transform:translateY(24px);opacity:.4;}to{transform:translateY(0);opacity:1;}}
  .toc-header{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 10px;
    border-bottom:1px solid var(--line);flex:0 0 auto;}
  .toc-header b{font-size:15px;color:var(--navy);}
  .toc-header button{border:none;background:var(--bg);width:30px;height:30px;border-radius:9px;
    font-size:15px;color:var(--muted);cursor:pointer;}
  .toc-list{overflow-y:auto;padding:8px 10px 20px;}
  .toc-group-label{font-size:11px;font-weight:800;color:var(--orange);padding:12px 10px 6px;letter-spacing:.03em;}
  .toc-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:none;
    background:none;padding:11px 10px;border-radius:12px;font-size:13.5px;color:var(--ink);cursor:pointer;}
  .toc-item:active{background:var(--bg);}
  .toc-item .num{flex:0 0 auto;width:22px;height:22px;border-radius:7px;background:var(--bg);
    color:var(--muted);font-size:10.5px;font-weight:800;display:flex;align-items:center;justify-content:center;}
  .toc-item.current{background:var(--blue-pale);}
  .toc-item.current .num{background:var(--blue);color:#fff;}
  .toc-item.current span.label{color:var(--blue-deep);font-weight:800;}

  @media (min-width:768px){
    .stepper-bar{display:none;}
    .toc-overlay{display:none !important;}
    #sidebarNav{display:block;flex:0 0 240px;width:240px;position:sticky;top:0;height:100vh;
      overflow-y:auto;background:#fff;border-right:1px solid var(--line);padding:18px 12px;}
    #sidebarNav .side-title{font-size:13px;font-weight:800;color:var(--navy);padding:0 10px 12px;}
    main{max-width:none;}
    body{display:flex;justify-content:center;}
    .app-shell{max-width:920px;width:100%;}
  }

  main{padding:22px 18px 10px;max-width:640px;margin:0 auto;}
  section{margin-bottom:34px;display:none;}
  section.active{display:block;}
  .pdf-mode section{display:block !important;}
  .pdf-mode .stepper-bar{display:none !important;}
  .eyebrow{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;
    color:var(--blue);background:var(--blue-pale);padding:5px 11px;border-radius:20px;margin-bottom:10px;}
  h2{font-size:20px;margin:0 0 6px;font-weight:800;color:var(--navy);}
  .sub{color:var(--muted);font-size:13.5px;margin:0 0 16px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px;margin-bottom:12px;box-shadow:0 1px 3px rgba(16,27,51,.04);}
  .hero-card{background:linear-gradient(150deg,var(--blue-deep) 0%,var(--blue) 55%,#3E6FE8 100%);
    color:#fff;border-radius:22px;padding:24px 20px;position:relative;overflow:hidden;}
  .hero-card::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;
    border-radius:50%;background:radial-gradient(circle,rgba(245,130,10,.35),transparent 70%);}
  .hero-tag{display:inline-block;background:rgba(255,255,255,.16);padding:4px 10px;border-radius:20px;
    font-size:11.5px;font-weight:700;margin-bottom:10px;}
  .hero-card h3{font-size:24px;margin:0 0 6px;font-weight:800;}
  .hero-card p{font-size:13.5px;opacity:.92;margin:0 0 14px;}
  .chips{display:flex;flex-wrap:wrap;gap:6px;}
  .chip{font-size:11.5px;background:rgba(255,255,255,.14);padding:5px 10px;border-radius:14px;font-weight:600;}
  .bar-row{display:flex;align-items:center;gap:10px;margin:10px 0;}
  .bar-label{width:78px;font-size:12.5px;font-weight:700;color:var(--navy);flex:0 0 auto;}
  .bar-track{flex:1;height:10px;background:var(--bg);border-radius:6px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--blue),#5C86EE);}
  .bar-fill.acc{background:linear-gradient(90deg,var(--orange),#FFA94D);}
  .bar-val{width:38px;text-align:right;font-size:12px;font-weight:800;color:var(--navy);}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .mini{background:var(--bg);border-radius:14px;padding:12px;}
  .mini h4{margin:0 0 6px;font-size:13px;color:var(--blue-deep);}
  .mini p{margin:0;font-size:12.5px;color:var(--ink);}
  ol.steps{padding-left:0;list-style:none;counter-reset:step;margin:0;}
  ol.steps li{counter-increment:step;padding-left:38px;position:relative;margin-bottom:14px;font-size:13.5px;}
  ol.steps li::before{content:counter(step);position:absolute;left:0;top:0;width:26px;height:26px;
    border-radius:50%;background:var(--blue);color:#fff;font-weight:800;font-size:12.5px;
    display:flex;align-items:center;justify-content:center;}
  ol.steps li b{display:block;color:var(--navy);margin-bottom:2px;}
  .dept-card{border-left:4px solid var(--blue);padding:12px 14px;background:var(--bg);border-radius:0 12px 12px 0;margin-bottom:10px;}
  .dept-card .rank{font-size:11px;font-weight:800;color:var(--blue);}
  .dept-card h4{margin:2px 0 5px;font-size:15px;color:var(--navy);}
  .dept-card p{margin:0;font-size:12.5px;color:var(--ink);}
  .subject-table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px;}
  .subject-table th{text-align:left;color:var(--muted);font-weight:700;font-size:11.5px;padding:6px 4px;border-bottom:2px solid var(--line);}
  .subject-table td{padding:8px 4px;border-bottom:1px solid var(--line);vertical-align:top;}
  .job-strip{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
  .job-pill{background:var(--orange-pale);color:#C25E00;font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:14px;}
  .check-item{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line);}
  .check-item:last-child{border-bottom:none;}
  .check-item input{margin-top:3px;width:17px;height:17px;accent-color:var(--blue);flex:0 0 auto;}
  .check-item label{font-size:13.5px;color:var(--ink);}
  .check-item .scale{font-size:11px;color:var(--muted);display:block;margin-top:2px;}
  .foot-note{font-size:11.5px;color:var(--muted);text-align:center;margin-top:24px;}
  .temp-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;}
  .temp-card h4{margin:0 0 10px;font-size:14px;color:var(--navy);}
  .temp-block{font-size:12.5px;margin-bottom:8px;padding-left:4px;}
  .temp-block b{display:block;font-size:12px;margin-bottom:3px;}
  .temp-block.good b{color:#1E8A5F;}
  .temp-block.watch b{color:#C25E00;}
  .temp-block ul{margin:0;padding-left:16px;}
  .temp-block li{margin-bottom:2px;}
  .role-card{background:linear-gradient(135deg,var(--orange-pale),#FFF8ED);border-radius:16px;padding:16px 18px;margin-bottom:14px;border:1px solid #FADFB3;}
  .role-card h4{margin:0 0 6px;font-size:13.5px;color:#C25E00;}
  .role-card p{margin:0;font-size:13px;}
  .doc-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 16px;margin-bottom:10px;}
  .doc-card .doc-tag{display:inline-block;font-size:10.5px;font-weight:800;color:var(--blue-deep);background:var(--blue-pale);padding:3px 9px;border-radius:10px;margin-bottom:8px;}
  .doc-card p.body{background:var(--bg);border-radius:10px;padding:11px 13px;font-size:12.5px;line-height:1.65;margin:0 0 8px;color:var(--ink);}
  .doc-card p.tip{margin:0;font-size:11.5px;color:var(--muted);}
  .doc-card p.tip b{color:var(--orange);}
  .tip-box{background:var(--orange-pale);border:1px solid #FADFB3;border-radius:14px;padding:13px 15px;font-size:12px;color:#8A4B00;margin-bottom:14px;}
  .interview-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 16px;margin-bottom:10px;}
  .interview-card .q2{font-weight:800;font-size:13.5px;color:var(--navy);margin-bottom:6px;}
  .interview-card .q2::before{content:"Q. ";color:var(--orange);}
  .interview-card .a2{font-size:12.5px;color:var(--ink);margin:0;}

  .diag-card{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--blue);
    border-radius:0 16px 16px 0;padding:16px 17px;margin-bottom:12px;}
  .diag-card .pair{display:flex;gap:6px;align-items:center;margin-bottom:8px;flex-wrap:wrap;}
  .diag-card .axis-tag{font-size:11px;font-weight:800;padding:4px 10px;border-radius:12px;}
  .axis-tag.p{background:var(--blue-pale);color:var(--blue-deep);}
  .axis-tag.a{background:#F1EAFB;color:#6A3FBF;}
  .axis-tag.q{background:#E8F6EE;color:#1E8A5F;}
  .diag-card .vs{font-size:11px;color:var(--muted);font-weight:700;}
  .diag-card h4{margin:0 0 6px;font-size:14.5px;color:var(--navy);}
  .diag-card .sym{font-size:12.5px;color:var(--ink);margin:0 0 8px;padding:10px 12px;background:var(--bg);border-radius:10px;}
  .diag-card .sym b{color:#C0392B;}
  .diag-card .rx{font-size:12.5px;color:var(--ink);margin:0;}
  .diag-card .rx b{color:#1E8A5F;}
  .compare-table{width:100%;border-collapse:collapse;font-size:12px;}
  .compare-table th{background:var(--navy);color:#fff;padding:9px 8px;font-size:11.5px;text-align:left;}
  .compare-table td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top;}
  .compare-table td:first-child{font-weight:800;color:var(--navy);width:26%;}
  .mission-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 16px;margin-bottom:10px;position:relative;}
  .mission-card .diff{display:inline-block;font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:10px;margin-bottom:8px;}
  .diff.mid{background:var(--blue-pale);color:var(--blue-deep);}
  .mission-card h4{margin:0 0 5px;font-size:14px;color:var(--navy);}
  .mission-card p{margin:0 0 8px;font-size:12.5px;color:var(--ink);}
  .mission-card .link-skill{font-size:11px;color:var(--muted);}
  .interpret-band{display:flex;gap:8px;margin-top:14px;}
  .interpret-band .band{flex:1;text-align:center;border-radius:12px;padding:10px 6px;font-size:11px;}
  .band.low{background:#FDEAEA;color:#C0392B;}
  .band.mid{background:#FFF6E5;color:#B4740E;}
  .band.high{background:#E8F6EE;color:#1E8A5F;}
  .band b{display:block;font-size:15px;margin-bottom:2px;}
  .faq-item{border-bottom:1px solid var(--line);padding:13px 0;}
  .faq-item:last-child{border-bottom:none;}
  .faq-item .q{font-weight:800;font-size:13.5px;color:var(--navy);margin-bottom:5px;}
  .faq-item .q::before{content:"Q. ";color:var(--blue);}
  .faq-item .a{font-size:12.5px;color:var(--ink);margin:0;}
  @media print{
    header.top, .stepper-bar, .pdf-btn{display:none !important;}
    body{padding-bottom:0;}
  }

  .cover{background:#F4F2FB;padding:28px 20px 26px;}
  .cover-inner{max-width:640px;margin:0 auto;}
  .cover-brand-row{display:flex;align-items:center;gap:9px;margin-bottom:16px;}
  .cover-badge{width:34px;height:34px;border-radius:9px;background:var(--blue-deep);color:#fff;
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex:0 0 auto;}
  .cover-brand-row .word{font-size:15px;font-weight:800;color:var(--navy);}
  .cover h1{font-size:23px;font-weight:800;margin:0 0 18px;color:var(--navy);line-height:1.35;}
  .cover-card{background:#fff;border-radius:16px;padding:18px 18px;margin-bottom:12px;
    box-shadow:0 1px 4px rgba(16,27,51,.05);}
  .cover-card h4{margin:0 0 10px;font-size:13.5px;color:var(--blue-deep);font-weight:800;}
  .cover-card ol{margin:0;padding-left:18px;font-size:12px;color:var(--ink);line-height:1.8;}
  .process-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
  .process-grid div{background:#fff;border-radius:12px;padding:12px 13px;font-size:11px;line-height:1.5;
    border-left:4px solid var(--blue);box-shadow:0 1px 4px rgba(16,27,51,.05);}
  .process-grid div.pg-sim{border-left-color:#1E8A5F;}
  .process-grid div.pg-att{border-left-color:#6A3FBF;}
  .process-grid b{display:block;font-size:12.5px;margin-bottom:3px;color:var(--navy);}
  .process-grid span{color:var(--muted);}
  .profile-card{background:#fff;border-radius:16px;padding:16px 18px;margin-bottom:12px;
    box-shadow:0 1px 4px rgba(16,27,51,.05);}
  .profile-card h3{margin:0 0 4px;font-size:18px;color:var(--navy);font-weight:800;}
  .profile-card p{margin:0;font-size:12.5px;color:var(--muted);}
  .id-dark-card{background:linear-gradient(155deg,var(--navy),var(--blue-deep));color:#fff;border-radius:16px;
    padding:18px 18px 16px;margin-bottom:16px;}
  .id-dark-card .id-row{display:flex;justify-content:space-between;align-items:center;
    font-size:10.5px;letter-spacing:.05em;opacity:.65;margin-bottom:12px;font-weight:700;}
  .id-dark-card .subtype{font-size:11.5px;opacity:.75;margin-bottom:3px;}
  .id-dark-card .typename{font-size:19px;font-weight:800;margin-bottom:12px;}
  .id-dark-card .chip{font-size:11px;background:rgba(255,255,255,.14);padding:4px 10px;border-radius:12px;font-weight:600;}
  .about-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 17px;margin-bottom:12px;}
  .about-card h4{margin:0 0 8px;font-size:14px;color:var(--navy);}
  .about-card p{margin:0;font-size:12.5px;color:var(--ink);}
  .advisor-card{display:flex;gap:12px;align-items:flex-start;background:var(--navy);color:#fff;border-radius:16px;padding:16px 17px;margin-bottom:12px;}
  .advisor-card .av{flex:0 0 auto;width:44px;height:44px;border-radius:50%;background:var(--orange);
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;}
  .advisor-card .txt b{display:block;font-size:13px;margin-bottom:3px;}
  .advisor-card .txt p{margin:0;font-size:12px;opacity:.85;line-height:1.6;}
  .cover-teaser{margin-top:16px;background:linear-gradient(135deg,var(--orange),#E06E00);border-radius:16px;
    padding:18px 20px;text-align:center;box-shadow:0 6px 18px rgba(245,130,10,.25);}
  .cover-teaser .big{display:flex;align-items:center;justify-content:center;gap:7px;
    font-size:14.5px;font-weight:800;color:#fff;margin:0 0 8px;letter-spacing:-.01em;}
  .cover-teaser .finding{margin:0;font-size:12.5px;color:#fff;opacity:.95;line-height:1.6;}
  .cover-teaser .finding b{font-weight:800;text-decoration:underline;text-underline-offset:2px;}
  .cover-teaser .chev{margin-top:10px;color:rgba(255,255,255,.7);}
  .hook-card{background:var(--navy);color:#fff;border-radius:18px;padding:18px 18px 16px;margin-bottom:16px;}
  .hook-card h4{margin:0 0 12px;font-size:14.5px;text-align:center;}
  .hook-q{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.14);font-size:13px;}
  .hook-q:last-of-type{border-bottom:none;}
  .hook-q .mark{flex:0 0 auto;width:20px;height:20px;border-radius:50%;background:var(--orange);
    display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;}
  .hook-cta{margin-top:12px;text-align:center;font-size:12px;color:#FFD9A0;font-weight:700;}
  .recommend-box{background:var(--blue-pale);border:1px solid #CBDBFA;border-radius:16px;padding:16px 17px;margin-bottom:16px;}
  .recommend-box h4{margin:0 0 10px;font-size:13.5px;color:var(--blue-deep);}
  .recommend-box li{font-size:12.5px;color:var(--ink);margin-bottom:7px;padding-left:22px;position:relative;list-style:none;}
  .recommend-box li::before{content:"✓";position:absolute;left:0;color:var(--blue);font-weight:800;}
  .recommend-box ul{margin:0;padding:0;}
  .combo-tag{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;
    background:var(--bg);border:1px dashed var(--blue);color:var(--blue-deep);border-radius:10px;
    padding:5px 10px;margin:8px 0 0;}
  .radar-wrap{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;text-align:center;}
  .radar-wrap svg{width:100%;max-width:260px;}
  .radar-legend{display:flex;justify-content:center;gap:14px;margin-top:8px;flex-wrap:wrap;}
  .radar-legend span{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:4px;}
  .radar-legend i{width:9px;height:9px;border-radius:50%;display:inline-block;}
  .icon-badge{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;
    vertical-align:middle;flex:0 0 auto;}
  .icon-badge svg{width:100%;height:100%;}
  h4 .icon-badge{margin-right:6px;}
  .combo-preview{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 17px;margin-bottom:14px;}
  .combo-preview h4{display:flex;align-items:center;margin:0 0 12px;font-size:13.5px;color:var(--navy);}
  .cp-row{display:flex;align-items:center;gap:9px;padding:9px 0;border-top:1px solid var(--line);flex-wrap:wrap;}
  .cp-row:first-of-type{border-top:none;}
  .cp-num{flex:0 0 auto;width:20px;height:20px;border-radius:6px;background:var(--navy);color:#fff;
    font-size:10.5px;font-weight:800;display:flex;align-items:center;justify-content:center;}
  .cp-desc{color:var(--muted);font-size:11.5px;margin-left:auto;text-align:right;}

function riasecScores(ans){
  const s = {R:0,I:0,A:0,S:0,E:0,C:0};
  IQ.forEach((it,i)=>{ if(ans[i]) s[it.t]++; });
  return s;
}
function riasecRank(ans){
  const s = riasecScores(ans);
  return Object.keys(s).sort((a,b)=> s[b]-s[a] || 'RIASEC'.indexOf(a)-'RIASEC'.indexOf(b));
}
/* 흥미 일치도: 2=높음, 1=보통, 0=낮음 */
function interestLevel(codes, ans){
  const rank = riasecRank(ans), top2 = rank.slice(0,2), top3 = rank.slice(0,3);
  if(top2.indexOf(codes[0])>-1) return 2;
  if(top3.indexOf(codes[0])>-1 || top2.indexOf(codes[1])>-1) return 1;
  if(top3.indexOf(codes[1])>-1) return 1;
  return 0;
}

/* ---- 적합도 산출 ----

   여유도: 요구를 넘어선 만큼의 여유(최대 +30p까지만 인정)
   최종  : 충족률 85% + 여유도 15%                                   */
function fitRaw(req){
  const keys = ['q','p','s','a'];
  let wsum=0, meet=0, slack=0;
  keys.forEach((k,i)=>{
    const R = req[i], M = ME[k];
    if(R<=0) return;
    wsum += R;
    const ratio = Math.min(M/R, 1);
    meet += R * Math.pow(ratio,3);
    slack += R * Math.max(0, Math.min((M-R)/30, 1));
  });
  if(!wsum) return 0;
  const meetPct = meet/wsum*100, slackPct = slack/wsum*100;
  return Math.min(99, meetPct*0.85 + slackPct*0.15);
}
function fitScore(req){ return Math.round(fitRaw(req)); }
function fitBadge(v){
  if(v>=82) return {cls:'b1', label:'강점 직결형'};
  if(v>=65) return {cls:'b2', label:'균형형'};
  return {cls:'b3', label:'성장 설계형'};
}
/* 조사 자동 선택 — 받침 유무로 판단 */
function josa(word, withJong, noJong){
  const code = word.charCodeAt(word.length-1);
  if(code < 0xAC00 || code > 0xD7A3) return noJong;
  return ((code - 0xAC00) % 28) ? withJong : noJong;
}
const J = {
  i:  w=>w+josa(w,'이','가'),
  eul:w=>w+josa(w,'을','를'),
  eun:w=>w+josa(w,'은','는')
};

/* worst = 요구 대비 가장 크게 미달한 축
   best  = 요구를 충족한 축 중 요구 수준이 가장 높은 축(= 그 일이 가장 많이 쓰는 강점) */
function gapText(req){
  let worst=null, worstGap=0, best=null, bestReq=-1, fallback=null, fbGap=-999;
  AXES.forEach((ax,i)=>{
    const g = ME[ax[0]] - req[i];
    if(g < worstGap){ worstGap=g; worst=ax[1]; }
    if(g >= 0 && req[i] > bestReq){ bestReq=req[i]; best=ax[1]; }
    if(g > fbGap){ fbGap=g; fallback=ax[1]; }
  });
  if(!best) best = fallback;
  return {worst:worst, worstGap:Math.abs(Math.round(worstGap)), best:best, met:bestReq>=0};
}
function reqBars(req){
  return AXES.map((ax,i)=>
    `<div class="req-row"><div class="rlabel">${ax[1]}</div>`+
    `<div class="req-dual"><div class="need" style="width:${req[i]}%"></div>`+
    `<div class="have" style="left:${ME[ax[0]]}%"></div></div>`+
    `<b style="font-size:11.5px;color:var(--orange)">${ME[ax[0]]}%</b></div>`
  ).join('') +
  `<div class="req-legend"><span><i style="background:#DCE4F6"></i>요구 수준</span><span><i style="background:var(--orange)"></i>내 정답률</span></div>`;
}

function currentPool(){
  if(STATE.tab==='major'){
    const M = MAJORS[STATE.cat][STATE.major];
    return {label:STATE.major, sub:STATE.cat, req:M.r, ids:M.j.slice()};
  }
  const L1 = NCS.filter(function(x){return x.c===STATE.ncs;})[0];
  const mids = L1.m.filter(function(L2){ return STATE.mids.indexOf(L2.c)>-1; });
  let ids=[], req=[0,0,0,0], n=0;
  mids.forEach(function(L2){ L2.j.forEach(function(j){
    ids.push(j.id); j.r.forEach(function(v,i){ req[i]+=v; }); n++;
  }); });
  req = req.map(function(v){ return n? Math.round(v/n) : 0; });
  return {label:L1.n, sub: mids.map(function(x){return x.n;}).join(' · ') || '중분류를 선택해주세요', req:req, ids:ids};
}
function rankedJobs(){
  return currentPool().ids.map(function(id){
    const j = JOB[id];
    return Object.assign({}, j, {fit:fitScore(j.r), raw:fitRaw(j.r), il:interestLevel(j.ria, STATE.ans)});
  }).sort(function(a,b){ return b.raw-a.raw; });
}
function quadrants(){
  const list = rankedJobs();
  const q = {q1:[],q2:[],q3:[],q4:[]};
  list.forEach(function(j){
    const cog = j.fit>=75, itr = j.il>=1;
    if(cog && itr) q.q1.push(j);
    else if(!cog && itr) q.q2.push(j);
    else if(cog && !itr) q.q3.push(j);
    else q.q4.push(j);
  });
  return q;
}

function renderFit(){
  const pool = currentPool();
  const area = document.getElementById('fitArea');
  if(!pool.ids.length){
    area.innerHTML = '<div class="card"><p class="sub" style="margin:0;">중분류를 1개 이상 선택하면 적합도와 직무 순위가 계산돼요.</p></div>';
    return;
  }
  const v = fitScore(pool.req), g = gapText(pool.req), b = fitBadge(v);
  const desc = g.worstGap>0
    ? '이 영역이 가장 많이 쓰는 '+J.eun(g.best)+' 요구 수준을 충족해요. 다만 '+J.eun(g.worst)+' 약 '+g.worstGap+'p 낮아 보완 설계가 필요해요.'
    : '이 영역이 요구하는 4개 축을 모두 충족해요. 특히 '+J.eun(g.best)+' 이 영역의 핵심 요구 축이라 강점이 그대로 쓰입니다.';
  area.innerHTML =
    '<div class="sel-summary">선택한 영역 · <b>'+pool.label+'</b> <span style="opacity:.7">'+pool.sub+'</span></div>'+
    '<div class="gauge-wrap"><div class="gauge-circle" style="--pct:'+v+'"><b>'+v+'%</b></div>'+
    '<div class="gauge-txt"><h4>'+pool.label+' 영역 적합도 '+v+'% <span class="fit-badge '+b.cls+'">'+b.label+'</span></h4>'+

    '<div class="card"><h4 style="margin:0 0 4px;font-size:14px;color:var(--navy);">영역 요구 인지패턴 vs 내 프로파일</h4>'+
    '<p class="sub" style="margin-bottom:10px;">회색 막대 = 통상 요구 수준 · 주황 선 = 내 실제 정답률</p>'+ reqBars(pool.req)+'</div>'+
    '<div class="tip-box">같은 영역을 골라도 사람마다 결과가 달라요. 적합도는 "영역"이 아니라 "영역 × 내 프로파일"의 조합으로 결정됩니다.</div>';
}

    const b = fitBadge(j.fit), ib = INT_BADGE[j.il], g = gapText(j.r);
    const line = (j.fit>=82)
      ? '이 직무가 가장 많이 쓰는 '+J.i(g.best)+' 요구 수준을 웃돌아, 강점이 곧바로 성과로 이어져요.'
      : (j.fit>=65
        ? '대체로 요구 수준에 근접해요. '+J.eul(g.worst)+' 보완하면 상위권으로 올라설 수 있어요.'
        : J.i(g.worst)+' 요구 수준보다 '+g.worstGap+'p 낮은 직무예요. 관심이 있다면 이 축을 우선 훈련 대상으로 잡아보세요.');
    const iline = j.il===2 ? '' :
      (j.il===1 ? ' 흥미는 보통 수준이라, 실제 업무 내용을 한 번 확인해보는 걸 권해요.'
                : ' 다만 흥미 유형과는 거리가 있어, 오래 지속할 수 있을지 따져볼 필요가 있어요.');
    return '<div class="dept-card">'+
      '<div class="rank" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">'+
      '<span class="rank-medal r'+(i+1)+'">'+(i+1)+'</span>적합도 '+j.fit+'% '+
      '<span class="fit-badge '+b.cls+'">'+b.label+'</span>'+
      '<span class="int-badge '+ib.cls+'">'+ib.label+'</span></div>'+
      '<h4>'+j.n+'</h4>'+
      '<p><span style="color:var(--muted);font-size:11.5px;">'+j.l1+' &gt; '+j.l2+' · 흥미코드 '+j.ria.join('')+'</span><br>'+line+iline+'</p>'+
      '<div class="job-strip">'+j.k.split('·').map(function(k){return '<span class="job-pill">'+k+'</span>';}).join('')+'</div>'+
      '</div>';
  }).join('');
  const spread = top[0].fit - top[top.length-1].fit;
  if(top.length>1 && spread<=4){
    area.innerHTML += '<div class="tip-box" style="margin-top:4px;">상위 직무들의 적합도 차이가 '+spread+'p 이내예요. 인지 요구 패턴이 서로 비슷하다는 뜻이라, 이럴 때는 <b>위 매트릭스의 흥미 축으로</b> 판단하시는 게 맞습니다.</div>';
  }
}

/* ================= 09 역량매칭 ================= */
function renderSkill(){
  const list = rankedJobs().slice(0,2);
  const area = document.getElementById('skillArea');
  if(!list.length){ area.innerHTML=''; return; }
  area.innerHTML = list.map(function(j,i){
    const short = AXES.map(function(ax,k){ return {name:ax[1], gap:ME[ax[0]]-j.r[k]}; })
                      .filter(function(x){return x.gap<0;}).sort(function(a,b){return a.gap-b.gap;});
    const verdict = short.length===0
      ? '<b style="color:#1E8A5F;">✓ 4개 영역 모두 요구 수준 이상</b> — 현재 프로파일로 바로 실무 적응이 가능한 직무예요.'
      : '<b style="color:#C25E00;">△ '+J.i(short[0].name)+' 요구 수준보다 '+Math.abs(short[0].gap)+'p 낮음</b> — 이 축을 겨냥한 훈련을 병행하면 순위가 올라가요.';
    return '<div class="card"><h4 style="margin:0 0 4px;font-size:14.5px;color:var(--navy);">RANK '+(i+1)+' · '+j.n+'</h4>'+
      '<p class="sub" style="margin-bottom:10px;">'+j.l1+' &gt; '+j.l2+' · 통상 요구 역량 프로파일</p>'+
      reqBars(j.r)+'<p style="margin:10px 0 0;font-size:12.5px;">'+verdict+'</p></div>';
  }).join('');
}

/* ================= 10 기업이 보는 축 ================= */
function renderMirror(){
  const top = rankedJobs()[0];
  const area = document.getElementById('mirrorArea');
  if(!top){ area.innerHTML=''; return; }
  const ordered = AXES.map(function(ax,i){ return {k:ax[0], n:ax[1], req:top.r[i], me:ME[ax[0]]}; })
                      .sort(function(a,b){ return b.req-a.req; });
  const key = ordered.slice(0,3);
  const weak = ordered.filter(function(x){ return x.me < x.req; })
                      .sort(function(a,b){ return (a.me-a.req)-(b.me-b.req); })[0];
  const qA = weak
    ? '"'+ (weak.n==='동시처리' ? '요구사항이 중간에 바뀌었던 상황을 어떻게 처리했나요?'
        : weak.n==='주의력' ? '오래 집중해야 하는 반복 업무를 끝까지 해낸 경험이 있나요?'
        : weak.n==='계획력' ? '한 번에 여러 일이 몰렸을 때 우선순위를 어떻게 정했나요?'
        : '정해진 절차를 지켜야 하는 일에서 실수를 막기 위해 무엇을 했나요?') + '"'
    : '"본인의 강점이 실제 성과로 이어졌던 사례를 말씀해주세요."';
  const aA = weak
    ? '보완 축을 정면으로 겨냥한 질문이에요. "부족하지만 이렇게 대비한다"는 <b>구체적 방식</b>을 사례와 함께 준비하세요. 예: 회의 전 아이디어 사전 메모, 체크리스트 이중 검증.'
    : '강점을 묻는 질문이에요. 02번 키워드 표의 표현을 그대로 쓰되, 반드시 숫자가 들어간 사례를 붙이세요.';

  area.innerHTML =
    '<div class="mirror-card"><h4>'+top.n+' 직무에서 기업이 중점적으로 보는 축</h4>'+
    key.map(function(x){
      const mark = x.me>=x.req ? '충족' : '보완 필요';
      return '<div class="mirror-row"><span class="mname">'+x.n+'</span>'+
             '<span style="opacity:.7">요구 '+x.req+'%</span>'+
             '<span class="mval">내 '+x.me+'% · '+mark+'</span></div>';
    }).join('')+
    '<p class="mirror-note">요구 수준은 직무의 통상 기준이며, 실제 채용 기준은 기업마다 자사 고성과자 데이터로 다시 설정됩니다.</p></div>'+
    '<div class="interview-card"><div class="q2">'+qA+'</div><p class="a2">'+aA+'</p></div>'+
    '<div class="interview-card"><div class="q2">"본인이 가장 자신 있는 일하는 방식을 설명해주세요."</div>'+
    '<p class="a2">'+J.eun(key[0].n)+' 이 직무의 1순위 요구 축입니다. "'+key[0].n+'"이라는 심리학 용어 대신, 02번 표의 서류 언어(정확성·문제추적력·태스크 분해력)로 바꿔 말하는 편이 자연스럽습니다.</p></div>';
}

    '<div class="check-item"><input type="checkbox" id="es4"><label for="es4">약점을 보완 계획으로 재구성해 서술했다</label></div>'},
  employed:{title:'사내 어필·직무 전환 설계', sub:'재직자는 자소서보다 성과 기술서와 전환 논리가 필요합니다.', body:
    '<div class="doc-card"><span class="doc-tag">성과 기술서 · 인사평가용</span>'+
    '<p class="body">"[업무]를 수행하며 [N단계]의 검증 절차를 직접 설계해 [오류·재작업]을 [정량]만큼 줄였습니다. 반복 업무의 품질 편차를 낮추는 것이 제가 팀에 기여하는 방식입니다."</p>'+
    '<p class="tip"><b>Tip.</b> 재직자 평가에서는 "무엇을 했다"보다 "무엇이 줄었다·늘었다"가 설득력이 큽니다.</p></div>'+
    '<div class="doc-card"><span class="doc-tag">직무 전환 요청 논리</span>'+
    '<p class="body">"제 강점은 [축 조합]이고, 현재 업무에서는 그중 [일부]만 쓰이고 있습니다. [희망 직무]는 [요구 축]을 중심으로 하는 일이라, 같은 노력으로 더 큰 성과를 낼 수 있다고 판단합니다."</p>'+
    '<p class="tip"><b>Tip.</b> "지금 일이 안 맞는다"가 아니라 "강점 활용도를 높이겠다"는 프레임으로 말하는 게 안전합니다.</p></div>'+
    '<div class="doc-card"><span class="doc-tag">경력기술서 · 이직용</span>'+
    '<p class="body">"[기간] 동안 [직무]를 수행하며 [핵심 성과 3개]를 달성했습니다. 특히 절차 설계와 검증 영역에서 [정량 결과]를 만들었고, 이는 [지원 직무]의 핵심 요구와 직접 연결됩니다."</p>'+
    '<p class="tip"><b>Tip.</b> 09번 요구 프로파일에서 충족으로 표시된 축을 그대로 경력기술서의 소제목으로 쓰면 대응이 명확해집니다.</p></div>'+
    '<div class="tip-box">10번 예상 면접 질문은 경력직 면접에서도 그대로 나옵니다. 다만 경력자는 "대비 방식"이 아니라 <b>"실제로 그렇게 해서 무엇이 달라졌는지"</b>까지 답해야 합니다.</div>'},
  undecided:{title:'강점 언어화 기초', sub:'방향을 정하기 전이라도, 내 강점을 말로 옮기는 연습은 지금 할 수 있습니다.', body:
    '<div class="doc-card"><span class="doc-tag">1단계 · 장면 수집</span>'+
    '<p class="body">"끝까지 해냈던 순간" 3개를 적어보세요. 규모는 상관없습니다. 과제, 아르바이트, 동아리 무엇이든 좋아요.</p>'+
    '<p class="tip"><b>Tip.</b> 결과가 좋았던 일이 아니라, <b>과정에서 내가 무엇을 했는지 기억나는 일</b>을 고르세요.</p></div>'+
    '<div class="doc-card"><span class="doc-tag">2단계 · 축으로 번역</span>'+
    '<p class="body">각 장면에서 내가 한 행동을 02번 키워드 표의 언어로 바꿔봅니다. "그냥 열심히 했다" → "작업을 단계로 나누고 순서대로 확인했다".</p>'+
    '<p class="tip"><b>Tip.</b> 이 번역이 되면 어떤 직무를 고르든 서류의 뼈대가 이미 생긴 셈입니다.</p></div>'+
    '<div class="doc-card"><span class="doc-tag">3단계 · 방향 좁히기</span>'+
    '<p class="body">번역한 문장이 잘 어울리는 직무를 08번 매트릭스에서 찾아보세요. 최우선 칸에 반복해서 나타나는 직무 유형이 있다면 그게 출발점입니다.</p>'+
    '<p class="tip"><b>Tip.</b> 07번 상황을 재학생 또는 취업준비로 바꾸면 11·12번이 그 기준으로 다시 구성됩니다.</p></div>'}
};
function renderDocs(){
  const D = DOCS[STATE.mode];
  document.getElementById('docsTitle').textContent = D.title;
  document.getElementById('docsSub').textContent = D.sub;
  document.getElementById('docsArea').innerHTML = D.body;
  const top = rankedJobs()[0], dj = document.getElementById('docJob');
  if(dj && top) dj.textContent = top.n;
}

/* ================= 13 훈련 처방 ================= */
const RX = {
  '동시처리':['회의 시작 전 아이디어 3개를 미리 메모하고, 그중 1개는 반드시 말로 꺼내기 (주 2회)',
             '새 자료를 읽기 전 전체 구조를 한 장으로 먼저 그려보기 (주 3회)',
             '결론부터 말하고 근거를 뒤에 붙이는 순서로 보고 연습'],
  '주의력':['50분 집중 + 10분 휴식 단위로 작업 분할, 중단 횟수 기록',
           '작업 시작 전 방해 요소(알림·탭) 정리하는 2분 루틴 고정',
           '단순 반복 과제를 일부러 하루 20분 배치해 지속력 훈련'],
  '계획력':['주 단위로 할 일을 3단계 이하로 쪼개 적고, 금요일에 달성률 점검',
           '마감 역산으로 일정을 짜는 연습 — 시작일이 아니라 마감일부터'],
  '순차처리':['업무 절차를 직접 매뉴얼로 재작성해보기',
             '문제 발생 시 원인 후보를 순서대로 배제하는 기록 남기기']
};
function renderRx(){
  const top = rankedJobs()[0];
  const area = document.getElementById('rxArea');
  if(!top){ area.innerHTML=''; return; }
  const diffs = AXES.map(function(ax,k){ return {name:ax[1], gap:ME[ax[0]]-top.r[k], me:ME[ax[0]]}; });
  const under = diffs.filter(function(x){ return x.gap<0; }).sort(function(a,b){ return a.gap-b.gap; });
  const targets = (under.length ? under : diffs.slice().sort(function(a,b){ return a.me-b.me; }))
                    .slice(0,2).map(function(x){ return x.name; });
  const rxHead = under.length
    ? '1순위 직무 요구 수준에 미달한 축이에요. 이 축을 올리면 순위가 직접 움직입니다.'
    : '1순위 직무 요구는 모두 충족했어요. 그래서 직무 대비 보완이 아니라, <b>내 안에서 가장 낮은 축</b>을 훈련 대상으로 잡았습니다. 이 축이 올라가면 8번 매트릭스에서 도전 가능한 직무 범위가 넓어져요.';
  area.innerHTML = targets.map(function(t){
    const items = RX[t] || [];
    return '<div class="mission-card"><span class="diff mid">'+t+' 보완</span>'+
      '<h4>'+t+' 훈련 루틴</h4>'+
      '<ul style="margin:0 0 6px;padding-left:16px;font-size:12.5px;">'+
      items.map(function(i){return '<li style="margin-bottom:3px;">'+i+'</li>';}).join('')+'</ul>'+
      '<span class="link-skill">기준 직무 · '+top.n+'</span></div>';
  }).join('') +
  '<p class="sub" style="margin:2px 0 10px;">'+rxHead+'</p>'+
  '<div class="tip-box">이 루틴은 3개월 이상 유지해야 재검사에서 변화가 잡힙니다. K-PASS Home 앱에서 주간 단위로 기록하면 재검사 리포트에 훈련 이력이 함께 표시돼요.</div>';
}

/* ================= 통합 ================= */
function renderDynamic(){
  renderInterest(); renderPicker(); renderFit();
  renderMatrix(); renderJobs(); renderSkill();
  renderMirror(); renderSummary();
  renderRoadmap(); renderDocs(); renderRx();
}
function render(){
  document.getElementById('t-brand').textContent = HEADER.brand;
  document.getElementById('t-title').textContent = HEADER.title;
  document.getElementById('t-meta').textContent = HEADER.meta;
  document.getElementById('pdfLabel').textContent = HEADER.pdf;
  document.getElementById('t-footnote').textContent = HEADER.foot;
  document.getElementById('coverArea').innerHTML = COVER_HTML;
  Object.keys(SECTIONS).forEach(function(key){ document.getElementById(key).innerHTML = SECTIONS[key]; });
  renderToc(); updateStepper(); renderDynamic();
}

/* ================= 이벤트 ================= */
document.addEventListener('click', function(e){
  const t = e.target.closest ? e.target.closest('[data-role]') : null;
  if(t){
    const role = t.dataset.role, v = t.dataset.v;
    if(role==='mode'){ STATE.mode = v; STATE.tab = MODE_TAB[v]; renderDynamic(); return; }
    if(role==='tab'){ STATE.tab = v; renderDynamic(); return; }
    if(role==='cat'){ STATE.cat = v; STATE.major = Object.keys(MAJORS[v])[0]; renderDynamic(); return; }
    if(role==='mid'){
      const i = STATE.mids.indexOf(v);
      if(i>-1){ STATE.mids.splice(i,1); }
      else { STATE.mids.push(v); if(STATE.mids.length>2) STATE.mids.shift(); }
      renderDynamic(); return;
    }
  }
  const item = e.target.closest ? e.target.closest('.toc-item') : null;
  if(item){ showSection(parseInt(item.dataset.idx,10)); return; }
  if(e.target.id==='tocOpenBtn' || (e.target.closest && e.target.closest('#tocOpenBtn'))){ openToc(); return; }
  if(e.target.id==='tocCloseBtn'){ closeToc(); return; }
  if(e.target.id==='tocOverlay'){ closeToc(); return; }
  if(e.target.id==='prevBtn'){ showSection(currentIndex-1); return; }
  if(e.target.id==='nextBtn'){ showSection(currentIndex+1); return; }
  if(e.target.id==='pdfBtn' || (e.target.closest && e.target.closest('#pdfBtn'))){ downloadPdf(); return; }
});
document.addEventListener('change', function(e){
  if(e.target.id==='majorSelect'){ STATE.major = e.target.value; renderDynamic(); return; }
  if(e.target.id==='ncsSelect'){
    STATE.ncs = e.target.value;
    STATE.mids = [ NCS.filter(function(x){return x.c===STATE.ncs;})[0].m[0].c ];
    renderDynamic(); return;
  }
  if(e.target.className==='iq-box'){
    STATE.ans[parseInt(e.target.dataset.i,10)] = e.target.checked;
    renderDynamic(); return;
  }
});

function downloadPdf(){
  const wrap = document.getElementById('reportRoot');
  wrap.classList.add('pdf-mode');
  html2pdf().set({
    margin:10, filename:'박준서_D-CAS_성인직무결과지.pdf',
    image:{type:'jpeg', quality:0.98},
    html2canvas:{scale:2, useCORS:true},
    jsPDF:{unit:'mm', format:'a4', orientation:'portrait'},
    pagebreak:{mode:['css','legacy']}
  }).from(wrap).save().then(function(){wrap.classList.remove('pdf-mode');})
   .catch(function(){wrap.classList.remove('pdf-mode');});
}

render();
</script>
