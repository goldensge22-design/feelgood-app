<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>K-PASS 학과별 인지 대시보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F6FB; --panel:#FFFFFF; --ink:#16203A; --sub:#5A6684; --line:#DCE3F1;
  --blue:#2856D6; --blue-soft:#E7EDFC; --orange:#F5820A; --orange-soft:#FDEBD8; --orange-ink:#A85400;
  --plan:#E8962A; --att:#1FA08E; --sim:#E0466C; --suc:#3F66E0;
  --t-crisis:#C7372F; --t-support:#F5820A; --t-watch:#D9B400; --t-good:#2E9E6B; --t-gifted:#7A4FD6;
  --mid:#C6CFE3; --hi-fill:#2856D6; --lo-fill:#F5820A;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1424; --panel:#161E33; --ink:#E7ECF8; --sub:#9AA6C4; --line:#28324D;
    --blue:#7A9BFF; --blue-soft:#1B2850; --orange:#FF9A3D; --orange-soft:#3A2712; --orange-ink:#FFB36B;
    --mid:#3A4665; --hi-fill:#5B7FF0; --lo-fill:#FF9A3D;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1424; --panel:#161E33; --ink:#E7ECF8; --sub:#9AA6C4; --line:#28324D;
  --blue:#7A9BFF; --blue-soft:#1B2850; --orange:#FF9A3D; --orange-soft:#3A2712; --orange-ink:#FFB36B;
  --mid:#3A4665; --hi-fill:#5B7FF0; --lo-fill:#FF9A3D;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;font-size:15px;line-height:1.65;font-variant-numeric:tabular-nums;word-break:keep-all}
h1,h2,h3,p,ul,dl,dd{margin:0}
button,select,textarea,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;padding:10px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;font-weight:700}
.mark{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:6px;background:var(--blue);color:#fff;font-size:13px;font-weight:700}
.ctl{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ctl label{color:var(--sub);font-size:13.5px}
select,.btn,input[type=text]{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 12px;min-height:36px}
.btn{cursor:pointer}
.btn:hover{border-color:var(--blue)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:500}
.btn.primary:hover{filter:brightness(1.08)}
.banner{max-width:1240px;margin:14px auto 0;padding:0 24px}
.banner p{background:var(--orange-soft);color:var(--ink);border-left:3px solid var(--orange);padding:10px 14px;border-radius:0 6px 6px 0;font-size:14px}

/* layout */
.shell{display:grid;grid-template-columns:212px minmax(0,1fr);gap:0 40px;max-width:1240px;margin:0 auto;padding:12px 24px 96px}
.toc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 60px);align-self:start;height:calc(100vh - 76px);overflow:auto;padding:20px 8px 20px 0;border-right:1px solid var(--line)}
.toc-title{font-weight:700;margin-bottom:10px}
.toc-g{margin:0 0 14px}
.toc-gl{font-size:12.5px;color:var(--sub);margin:0 0 4px 12px}
.toc a{display:block;padding:5px 12px;border-left:2px solid var(--line);color:var(--sub);text-decoration:none;font-size:14px}
.toc a:hover{color:var(--ink)}
.toc a.on{border-left-color:var(--blue);color:var(--blue);font-weight:700}
main{min-width:0}

.sec{padding:48px 0 12px;border-top:1px solid var(--line);scroll-margin-top:72px}
.sec:first-child{border-top:0;padding-top:28px}
.sec h2{font-size:22px;line-height:1.35;letter-spacing:-.01em;margin-bottom:6px}
.lead{color:var(--sub);max-width:64ch;margin-bottom:22px}
h3{font-size:16px;margin:26px 0 10px}
.hero-meta{color:var(--sub);margin-bottom:8px}
.hero-h{font-size:clamp(26px,3.6vw,40px);line-height:1.25;letter-spacing:-.02em;font-weight:700;max-width:24ch;margin-bottom:30px}
.small{font-size:13px;color:var(--sub)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:20px}

/* hero strips */
.scale-strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;margin-bottom:30px}
.ss{border-top:3px solid var(--c);padding-top:10px}
.ss .nm{font-size:14px;color:var(--sub)}
.ss .v{font-size:32px;font-weight:700;line-height:1.2;letter-spacing:-.02em}
.ss .d{font-size:13px;color:var(--sub)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:18px 0;margin-bottom:24px}
.kpi{border-left:1px solid var(--line);padding:2px 16px}
.kpi:first-child{border-left:0;padding-left:0}
.kpi .n{font-size:26px;font-weight:700;line-height:1.2}
.kpi .l{font-size:14px}
.kpi .r{font-size:12.5px;color:var(--sub)}
.insights{padding-left:18px;max-width:70ch}
.insights li{margin-bottom:6px}

/* profile rows */
.prow{display:grid;grid-template-columns:96px minmax(0,1.3fr) minmax(0,1fr);gap:8px 20px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}
.prow.head{padding:0 0 6px;border-bottom:0;color:var(--sub);font-size:12.5px}
.pname{font-weight:700;display:flex;align-items:center;gap:8px}
.dotc{width:10px;height:10px;border-radius:50%;background:var(--c);display:inline-block}
.track{position:relative;height:26px}
.track .zone{position:absolute;top:0;bottom:0}
.track .zone.lo{background:var(--orange-soft)}
.track .zone.hi{background:var(--blue-soft)}
.track .norm{position:absolute;top:-2px;bottom:-2px;border-left:1px dashed var(--sub)}
.track .whisker{position:absolute;top:12px;height:3px;border-radius:2px;opacity:.55}
.track .dot{position:absolute;top:6px;width:14px;height:14px;margin-left:-7px;border-radius:50%;border:2px solid var(--panel)}
.track .stick{position:absolute;top:3px;bottom:3px;border-left:2px solid var(--ink);opacity:.7}
.axis{position:relative;height:16px;font-size:11.5px;color:var(--sub)}
.axis span{position:absolute;transform:translateX(-50%)}
.stack{display:flex;height:22px;border-radius:4px;overflow:hidden;background:var(--line)}
.stack i{display:grid;place-items:center;font-style:normal;font-size:12px;color:#fff;min-width:0}
.stack .s-lo{background:var(--lo-fill)}
.stack .s-mid{background:var(--mid);color:var(--ink)}
.stack .s-hi{background:var(--hi-fill)}
.pnote{font-size:13px;color:var(--sub);margin-top:4px}
.tag{display:inline-block;padding:1px 8px;border-radius:4px;background:var(--blue-soft);color:var(--blue);font-size:12.5px;margin:2px 4px 2px 0;white-space:nowrap}
.tag.warn{background:var(--orange-soft);color:var(--orange-ink)}
.tag.crisis{background:var(--t-crisis);color:#fff}
.tag.gift{background:var(--t-gifted);color:#fff}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--sub);margin-top:10px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:6px;vertical-align:-1px}

/* tiers */
.tier{padding:14px 0;border-bottom:1px solid var(--line)}
.tier-h{display:grid;grid-template-columns:120px minmax(0,1fr) 110px;gap:8px 16px;align-items:center}
.tier-n{font-weight:700;display:flex;align-items:center;gap:8px}
.bar{height:14px;background:var(--line);border-radius:3px;overflow:hidden}
.bar b{display:block;height:100%;background:var(--c)}
.tier-c{text-align:right;font-weight:700}
.tier .rule{font-size:13px;color:var(--sub);margin:4px 0 0 136px}
details{margin:6px 0 0 136px}
summary{cursor:pointer;color:var(--blue);font-size:13.5px}
.ids{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.id{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:1px 8px;font-size:13px}
.alerts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:22px}
.alert{border-top:1px solid var(--line);padding-top:10px}
.alert .n{font-size:22px;font-weight:700}

/* balance */
.bal{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px;align-items:start}
.scatter{width:100%;height:auto;max-width:520px;display:block}
.scatter text{fill:var(--sub);font-size:11px}
.scatter .ax{stroke:var(--line)}
.scatter .cut{stroke:var(--sub);stroke-dasharray:3 4;opacity:.6}
.scatter .band{fill:var(--mid);opacity:.35}
.scatter circle{cursor:default}
.brow{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.brow b{font-size:18px}

/* tables */
.tw{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;width:100%;min-width:640px}
th{font-weight:500;color:var(--sub);font-size:12.5px;text-align:left;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.sc{display:inline-block;min-width:42px;text-align:center;border-radius:4px;padding:1px 6px;font-weight:500}
.b-lo{background:var(--orange-soft);color:var(--orange-ink)}
.b-hi{background:var(--blue-soft);color:var(--blue)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chipbtn{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 14px;cursor:pointer;font-size:13.5px}
.chipbtn[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}

/* rows of text blocks */
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}
.blk{border-top:3px solid var(--c,var(--blue));padding-top:10px}
.blk h3{margin:0 0 8px}
.blk ul{margin:0;padding-left:18px}
.blk li{margin-bottom:5px}
.gt{display:grid;grid-template-columns:200px minmax(0,1fr) 60px;gap:6px 16px;padding:14px 0;border-bottom:1px solid var(--line);align-items:start}
.gt .n{font-weight:700}
.gt .cnt{text-align:right;font-weight:700;font-size:18px}
.dv{display:grid;grid-template-columns:96px minmax(0,1fr) minmax(0,1fr);gap:10px 18px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}
.dvbar{display:flex;align-items:center;gap:8px;font-size:13px}
.dvbar .bar{flex:1}
.pair{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:14px}
.pair div{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:10px 12px;font-size:14px}
.heat td,.heat th{text-align:center}
.heat td:first-child,.heat th:first-child{text-align:left}
.heat .gobtn{background:none;border:0;color:var(--blue);cursor:pointer;padding:0;font-weight:700}
.tl{position:relative;height:74px;margin:14px 8px 8px}
.tl .base{position:absolute;left:0;right:0;top:30px;height:8px;background:var(--line);border-radius:4px}
.tl .win{position:absolute;top:30px;height:8px;background:var(--blue);border-radius:4px}
.tl .lbl{position:absolute;font-size:12.5px;color:var(--sub);transform:translateX(-50%);white-space:nowrap}
.tl .now{position:absolute;top:22px;height:24px;border-left:2px solid var(--orange)}
.empty{border:1px dashed var(--line);border-radius:6px;padding:16px;color:var(--sub)}
.parent-card{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;margin-top:16px}
.say{background:var(--blue-soft);border-radius:6px;padding:12px 14px;margin-bottom:8px}
textarea{width:100%;min-height:150px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.err{color:var(--t-crisis);margin-top:8px;white-space:pre-line}
.ok{color:var(--t-good);margin-top:8px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}

@media (max-width:720px){
  .shell{display:block;padding:0 16px 80px}
  .top-in{padding:10px 16px}
  .banner{padding:0 16px}
  .toc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 56px);z-index:15;background:var(--bg);display:flex;gap:2px;overflow-x:auto;padding:8px 0;max-height:none;border-bottom:1px solid var(--line);margin:0 -16px;padding-left:16px;padding-right:16px}
  .toc-title,.toc-gl{display:none}
  .toc-g{display:flex;margin:0}
  .toc a{white-space:nowrap;border-left:0;border-bottom:2px solid transparent;padding:6px 10px}
  .toc a.on{border-bottom-color:var(--blue)}
  .scale-strip{grid-template-columns:repeat(2,minmax(0,1fr))}
  .prow{grid-template-columns:1fr}
  .bal{grid-template-columns:1fr}
  .tier-h{grid-template-columns:96px minmax(0,1fr) 70px}
  .tier .rule,details{margin-left:0}
  .gt,.dv{grid-template-columns:1fr}
  .gt .cnt{text-align:left}
}
@media print{
  .top,.toc,.banner,#s-data{display:none !important}
  .shell{display:block}
  body{background:#fff}
  .sec{break-inside:avoid-page}
}
</style>
<link rel="stylesheet" href="full-dashboard-shell.css?v=4">
</head>
<body data-mode="track">
<header class="top">
  <div class="top-in">
    <div class="brand"><span class="mark">KP</span><span>K-PASS 학과별 인지 대시보드</span></div>
    <div class="ctl">
      <label for="class-select">학과</label>
      <select id="class-select"></select>
      <button class="btn" id="btn-print" type="button">인쇄 / PDF 저장</button>
    </div>
  </div>
</header>
<div class="banner" id="banner"></div>
<div class="shell">
  <nav class="toc" id="toc" aria-label="목차"></nav>
  <main id="main"></main>
</div>

<script src="dashboard-runtime-config.js?v=2"></script>
<script src="result-data-adapter.js?v=2"></script>
<script>
(function(){
'use strict';

/* ============ 설정값: 판정 기준은 이 한 곳에서만 바꿔요. 화면의 문구와 집계가 모두 여기서 계산돼요 ============ */
var CFG = {
  mean:100, sd:15,            // 표준점수 평균, 표준편차
  hi:120,                     // 상: 이 점수 이상
  lo:85,                      // 하: 이 점수 이하
  crisis:80,                  // 위기 관리: 이 점수 이하인 영역이 crisisCount개 이상
  crisisCount:2,              // 위기 관리로 보는 최소 영역 수(1개만이면 지원 필요)
  watchMax:99,                // 관찰 유지: 가장 낮은 영역이 lo+1 ~ 이 점수
  lrGap:11,                   // 처리방식 우세(S/Q): |동시-순차| 이 점수 이상 = 우세형(5세는 lrGap5)
  lrGap5:12,                  // 5세 전용 S/Q 우세 기준(0~11 균형, 12 이상 우세)
  lrImb:20,                   // 좌우불균형: |동시-순차| 이 점수 이상(우세형과 별개)
  spread:40,                  // 프로파일 불균형: 최고 - 최저 이 점수 이상
  ci:7,                       // 개별 점수 95% 신뢰구간 폭(±)
  edge:3,                     // 경계선: 하 기준점(lo)에서 이 점수 이내(상 기준점은 쓰지 않음)
  dci:15,                     // 개인 내 강약: 개인 평균과의 차 이 점수 이상(선별용 단순 기준)
  profileStrengthGap:10,      // 개인 평균 대비 대표 강점형 기준
  minN:5,                     // 이 인원 미만이면 비율은 숨기고 인원수만 표시
  giftedMix:{each:110,avg:108},
  giftedAvg:100,
  attMate:108,
  retestMin:12, retestMax:18
};
Object.assign(CFG,(window.KPASS_DASHBOARD_CONFIG&&window.KPASS_DASHBOARD_CONFIG.policy)||{});

var SC = [
  {k:'PLAN', n:'계획력',  c:'var(--plan)'},
  {k:'ATT',  n:'주의력',  c:'var(--att)'},
  {k:'SIM',  n:'동시처리', c:'var(--sim)'},
  {k:'SUC',  n:'순차처리', c:'var(--suc)'}
];
var SCN = {}; SC.forEach(function(x){SCN[x.k]=x;});

/* 수업 전략 라이브러리(승인된 문구만 사용, AI 생성 없음). 초안이므로 검수 후 확정하세요 */
var LIB = {
  PLAN:{
    low:['단계별 체크리스트를 학습지나 칠판에 함께 제시해요','과제 시작 전에 3분 계획 시간을 정해요','전략 고르기, 실행하기, 되돌아보기 세 단계로 문제를 풀게 해요'],
    high:['모둠에서 계획을 세워 발표하는 역할을 맡겨요','기획부터 완성까지 이어지는 프로젝트형 과제를 줘요','스스로 목표를 정하고 점검하는 학습 계획표를 써요'],
    subj:{'국어':'읽기 전에 무엇을 알아낼지 한 줄로 적게 해요','수학':'풀기 전에 풀이 순서를 번호로 먼저 적게 해요','영어':'오늘 익힐 단어 수를 미리 정하고 체크하게 해요','예체능':'활동 전에 준비 순서를 그림 카드로 확인해요'},
    mission:'"오늘 할 일 3가지를 순서대로 적어 보기" 미션'
  },
  ATT:{
    low:['소음과 시각 자극을 줄인 집중 자리를 마련해요','짧은 집중 단위로 나누고 사이에 쉬는 시간을 둬요','과제 전에 호흡이나 스트레칭 같은 집중 루틴을 함께 해요'],
    high:['오래 집중해서 끝내는 탐구 과제를 맡겨요','관찰 기록이나 오류 찾기처럼 세밀함이 필요한 역할을 줘요','한 가지를 깊이 파고드는 시간을 수업 안에 마련해요'],
    subj:{'국어':'짧은 문단 단위로 나눠 읽고 잠깐 쉬어요','수학':'문제를 한 번에 하나씩 보여줘요','영어':'짧은 활동을 여러 번 나눠 진행해요','예체능':'몸을 쓰는 활동 사이에 집중 루틴을 넣어요'},
    mission:'"타이머를 맞추고 딴짓 없이 집중하기" 미션'
  },
  SIM:{
    low:['수업을 시작할 때 전체 그림(개념 지도)을 먼저 보여줘요','마인드맵이나 이야기 구조도로 정리하는 활동을 해요','블록이나 퍼즐 같은 공간 놀이를 반복해요'],

function avg(a){return a.length? a.reduce(function(t,e){return t+e;},0)/a.length : 0;}
function hasB(w){var c=w.charCodeAt(w.length-1)-0xAC00;return c>=0&&c<11172&&c%28!==0;}

function erf(x){var s=x<0?-1:1;x=Math.abs(x);var t=1/(1+0.3275911*x);var y=1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-0.284496736)*t+0.254829592)*t*Math.exp(-x*x);return s*y;}

function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

function sanitize(list){
  var classes={}, order=[], dropped=0, kept=0;
  (list||[]).forEach(function(c){
    if(!c||!c.id) return;
    var students=(c.students||[]).filter(function(st){
      if(!st||!st.id||!st.s) {dropped++;return false;}
      var ok=SC.every(function(x){var v=st.s[x.k];return typeof v==='number'&&isFinite(v)&&v>=40&&v<=200;});
      if(ok){kept++;}else{dropped++;}
      return ok;
    });
    var key=String(c.id);
    if(classes[key]||!students.length) return;
    classes[key]=Object.assign({},c,{id:key,label:c.label||key,grade:c.grade||0,students:students,
      enrolled:(c.enrolled!=null?c.enrolled:null),training:(c.training!=null?c.training:null)});
    order.push(key);
  });
  order.sort(function(a,b){return (classes[a].grade-classes[b].grade)|| (classes[a].label<classes[b].label?-1:1);});
  return {classes:classes,order:order,dropped:dropped,kept:kept};
}

function lrThresh(st){var m=/(\d+)\s*(?:y|세)/.exec(st.age||'');var yr=isFinite(Number(st.ageYears))?Number(st.ageYears):(m?parseInt(m[1],10):null);return yr===5?CFG.lrGap5:CFG.lrGap;}
function analyze(st){
  var v=SC.map(function(x){return st.s[x.k];});
  var min=Math.min.apply(null,v), max=Math.max.apply(null,v), pm=avg(v);
  var gap=st.s.SUC-st.s.SIM;
  var lrT=lrThresh(st);
  var lr=Math.abs(gap)>=lrT?(gap>0?'left':'right'):'bal';
  var lrImb=Math.abs(gap)>=CFG.lrImb;
  var balSub=null;
  if(lr==='bal'){balSub=(st.s.SUC<=CFG.lo&&st.s.SIM<=CFG.lo)?'low':((st.s.SUC>=CFG.hi&&st.s.SIM>=CFG.hi)?'high':'ok');}
  var nCrisis=v.filter(function(e){return e<=CFG.crisis;}).length;
  var tier=nCrisis>=CFG.crisisCount?'crisis':(min<=CFG.lo?'support':(max>=CFG.hi?'gifted':(min<=CFG.watchMax?'watch':'good')));
  var twoE=max>=CFG.hi&&min<=CFG.lo;
  var edges=SC.filter(function(x){var s=st.s[x.k];return Math.abs(s-CFG.lo)<=CFG.edge;});
  var above=v.filter(function(e){return e>=CFG.giftedMix.each;}).length;
  var gt=[];
  if(above>=3&&pm>=CFG.giftedMix.avg&&max>=CFG.hi)gt.push('mix');
  ['PLAN','SIM','SUC'].forEach(function(k){if(st.s[k]>=CFG.hi&&pm>=CFG.giftedAvg)gt.push(k);});
  if(st.s.ATT>=CFG.hi&&['PLAN','SIM','SUC'].some(function(k){return st.s[k]>=CFG.attMate;}))gt.push('ATT');
  var dbl=SC.filter(function(x){return st.s[x.k]>=CFG.hi&&st.s[x.k]-pm>=CFG.dci;});
  var weak=SC.filter(function(x){return pm-st.s[x.k]>=CFG.dci;});
  var top=SC.slice().sort(function(a,b){return st.s[b.k]-st.s[a.k];});
  var typ=(st.s[top[0].k]-pm>=CFG.profileStrengthGap)?top[0].n+' 강점형':'고른 프로파일형';
  return {min:min,max:max,pm:pm,gap:gap,lr:lr,balSub:balSub,tier:tier,twoE:twoE,edges:edges,gt:gt,dbl:dbl,weak:weak,lrImb:lrImb,spread:(max-min)>=CFG.spread,lowBoth:st.s.SIM<=CFG.lo&&st.s.SUC<=CFG.lo,top:top,typ:typ};
}
function stats(c){
  var A=c.students.map(function(st){return {st:st,a:analyze(st)};});
  var n=A.length, m={},sd={},lo={},hi={},mid={};
  SC.forEach(function(x){
    var v=A.map(function(o){return o.st.s[x.k];}), mean=avg(v);
    m[x.k]=mean;
    sd[x.k]=n>1?Math.sqrt(v.reduce(function(t,e){return t+Math.pow(e-mean,2);},0)/(n-1)):0;
    lo[x.k]=v.filter(function(e){return e<=CFG.lo;}).length;
    hi[x.k]=v.filter(function(e){return e>=CFG.hi;}).length;
    mid[x.k]=n-lo[x.k]-hi[x.k];
  });
  return {A:A,n:n,m:m,sd:sd,lo:lo,mid:mid,hi:hi,ci:function(k){return n>1?1.96*sd[k]/Math.sqrt(n):0;}};
}
function schoolMeans(){
  var explicit=cur()&&cur().schoolMeans||state.meta&&state.meta.schoolMeans;
  if(explicit){var mapped={};SC.forEach(function(x){var v=explicit[x.k]!=null?explicit[x.k]:explicit[{PLAN:'planning',ATT:'attention',SIM:'simultaneous',SUC:'successive'}[x.k]];mapped[x.k]=Number(v);});if(SC.every(function(x){return isFinite(mapped[x.k]);}))return mapped;}
  if(classOrder.length<2)return null;
  var all=[];classOrder.forEach(function(k){all=all.concat(classes[k].students);});
  var o={};SC.forEach(function(x){o[x.k]=avg(all.map(function(s){return s.s[x.k];}));});return o;
}
function expected(){
  return {lo:cdf((CFG.lo+0.5-CFG.mean)/CFG.sd)*100, hi:(1-cdf((CFG.hi-0.5-CFG.mean)/CFG.sd))*100};
}
function flagsFor(a){
  var f=[];
  if(a.tier==='crisis')f.push('crisis'); else if(a.tier==='support')f.push('support');
  if(a.twoE)f.push('twoE');
  if(a.lowBoth)f.push('low2');
  if(a.edges.length)f.push('edge');
  return f;
}
var FLAGNAME={crisis:'위기 관리',support:'지원 필요',twoE:'2E 경보',low2:'동시·순차 동반 저하',edge:'경계선'};
var FLAGPRI={crisis:0,twoE:1,low2:2,support:3,edge:4};

/* ============ 섹션 렌더러 ============ */
function ovHTML(){
  var c=cur(),S=stats(c);
  var ord=SC.slice().sort(function(a,b){return S.m[b.k]-S.m[a.k];});
  var hi=ord[0],lo=ord[3],spread=S.m[hi.k]-S.m[lo.k];
  var head=spread<5?'네 영역이 고르게 나타나는 반이에요':iga(hi.n)+' 가장 높고 '+iga(lo.n)+' 가장 낮은 반이에요';
  var cntTier={};TIERS.forEach(function(t){cntTier[t.k]=S.A.filter(function(o){return o.a.tier===t.k;}).length;});
  var gCand=S.A.filter(function(o){return o.a.gt.length;}).length;
  var twoE=S.A.filter(function(o){return o.a.twoE;}).length;
  var lrN=S.A.filter(function(o){return o.a.lr!=='bal';}).length;
  var edge=S.A.filter(function(o){return o.a.edges.length;}).length;
  var strip=SC.map(function(x){
    var d=S.m[x.k]-CFG.mean;
    return '<div class="ss" style="--c:'+x.c+'"><div class="nm">'+x.n+'</div><div class="v">'+fmt1(S.m[x.k])+'</div><div class="d">규준 평균보다 '+(d>=0?'+':'')+fmt1(d)+'</div></div>';
  }).join('');
  var kp=[
    ['위기 관리',cntTier.crisis,CFG.crisis+' 이하 영역이 '+CFG.crisisCount+'개 이상'],
    ['지원 필요',cntTier.support,CFG.lo+' 이하 영역이 있는 나머지'],
    ['영역별 영재 후보',gCand,'영재 유형 기준 충족'],
    ['2E 경보',twoE,CFG.hi+' 이상과 '+CFG.lo+' 이하가 함께 있음'],
    ['처리방식 우세(S/Q)',lrN,'동시·순차 차 '+CFG.lrGap+' 이상(5세 '+CFG.lrGap5+')'],
    ['경계선',edge,CFG.lo+' ±'+CFG.edge+'점 이내']
  ].map(function(k){return '<div class="kpi"><div class="n">'+k[1]+'</div><div class="l">'+k[0]+'</div><div class="r">'+k[2]+'</div></div>';}).join('');
  var ex=expected(), ins=[];
  var moreLo=SC.filter(function(x){return S.n>=CFG.minN&&S.lo[x.k]/S.n*100>=ex.lo+10;});
  if(moreLo.length)ins.push('규준에서 기대되는 것보다 하 비율이 높은 영역은 <b>'+moreLo.map(function(x){return x.n;}).join(', ')+'</b>이에요. 수업 전략에서 이 영역을 먼저 살펴보세요.');
  else ins.push('하 비율이 규준 기대치(약 '+Math.round(ex.lo)+'%)를 크게 넘는 영역은 없어요.');
  var left=S.A.filter(function(o){return o.a.lr==='left';}).length, right=S.A.filter(function(o){return o.a.lr==='right';}).length;
  ins.push('순차처리(Q)가 더 높은 순차 우세형 '+left+'명, 동시처리(S)가 더 높은 동시 우세형 '+right+'명이에요.');
  var q=S.A.filter(function(o){return flagsFor(o.a).length;}).length;
  ins.push('먼저 살펴볼 학생은 '+q+'명이에요. “주의 학생”에서 사유와 조치 상태를 확인하세요.');
  var tested=classTestDate(c);
  return '<p class="hero-meta">'+esc(c.label)+', '+S.n+'명'+(tested?'이 '+ymd(tested)+'에 검사했어요.':'의 검사 결과예요.')+'</p>'
    +'<h1 class="hero-h">'+head+'</h1>'
    +'<div class="scale-strip">'+strip+'</div>'
    +'<div class="kpis">'+kp+'</div>'
    +'<ul class="insights">'+ins.map(function(t){return '<li>'+t+'</li>';}).join('')+'</ul>'
    +'<p class="small" style="margin-top:14px">하는 '+CFG.lo+' 이하, 중은 '+(CFG.lo+1)+'~'+(CFG.hi-1)+', 상은 '+CFG.hi+' 이상이에요. 이 화면은 선별을 돕는 자료이며 진단이 아니에요.</p>';
}

function balanceHTML(){
  var c=cur(),S=stats(c),n=S.n;
  var W=480,M=46,lo=60,hi=160;
  function X(v){return M+(v-lo)/(hi-lo)*(W-2*M);}
  function Y(v){return W-M-(v-lo)/(hi-lo)*(W-2*M);}
  var g=CFG.lrGap;
  var bandPts=[[lo,lo],[lo,lo+g],[hi-g,hi],[hi,hi],[hi,hi-g],[lo+g,lo]].map(function(p){return X(p[0])+','+Y(p[1]);}).join(' ');
  var cuts=[CFG.lo,CFG.hi].map(function(v){return '<line class="cut" x1="'+X(v)+'" y1="'+Y(lo)+'" x2="'+X(v)+'" y2="'+Y(hi)+'"></line><line class="cut" x1="'+X(lo)+'" y1="'+Y(v)+'" x2="'+X(hi)+'" y2="'+Y(v)+'"></line>'
    +'<text x="'+X(v)+'" y="'+(W-M+16)+'" text-anchor="middle">'+v+'</text><text x="'+(M-8)+'" y="'+(Y(v)+4)+'" text-anchor="end">'+v+'</text>';}).join('');
  var dots=S.A.map(function(o){
    var col=o.a.lr==='left'?'var(--suc)':(o.a.lr==='right'?'var(--sim)':'var(--sub)');
    var stroke=o.a.tier==='crisis'?'var(--t-crisis)':'var(--panel)';
    var sw=o.a.tier==='crisis'?2.5:1.5;
    return '<circle cx="'+X(o.st.s.SUC)+'" cy="'+Y(o.st.s.SIM)+'" r="5.5" fill="'+col+'" fill-opacity="'+(o.a.lr==='bal'?0.55:0.9)+'" stroke="'+stroke+'" stroke-width="'+sw+'"><title>'+esc(o.st.id)+' 순차 '+o.st.s.SUC+', 동시 '+o.st.s.SIM+' (차 '+(o.a.gap>0?'+':'')+o.a.gap+')</title></circle>';
  }).join('');
  var svg='<svg class="scatter" viewBox="0 0 '+W+' '+W+'" role="img" aria-label="순차처리와 동시처리 산점도">'
    +'<polygon class="band" points="'+bandPts+'"></polygon>'
    +'<line class="ax" x1="'+X(lo)+'" y1="'+Y(lo)+'" x2="'+X(hi)+'" y2="'+Y(lo)+'"></line><line class="ax" x1="'+X(lo)+'" y1="'+Y(lo)+'" x2="'+X(lo)+'" y2="'+Y(hi)+'"></line>'
    +cuts+dots
    +'<text x="'+(W/2)+'" y="'+(W-6)+'" text-anchor="middle">순차처리 (Q)</text>'
    +'<text x="12" y="'+(W/2)+'" text-anchor="middle" transform="rotate(-90 12 '+(W/2)+')">동시처리 (S)</text>'
    +'<text x="'+(X(lo)+8)+'" y="'+(Y(hi)+14)+'">동시(S) 우세</text><text x="'+(X(hi)-8)+'" y="'+(Y(lo)-8)+'" text-anchor="end">순차(Q) 우세</text>'
    +'</svg>';
  var left=S.A.filter(function(o){return o.a.lr==='left';}), right=S.A.filter(function(o){return o.a.lr==='right';});
  var bal=S.A.filter(function(o){return o.a.lr==='bal';});
  var bl=bal.filter(function(o){return o.a.balSub==='low';}).length, bh=bal.filter(function(o){return o.a.balSub==='high';}).length;
  var rows=[
    ['순차처리(Q) 우세형','순차처리가 동시처리보다 '+CFG.lrGap+'점 이상 높아요(5세 '+CFG.lrGap5+')',left.length,'var(--suc)'],
    ['동시처리(S) 우세형','동시처리가 순차처리보다 '+CFG.lrGap+'점 이상 높아요(5세 '+CFG.lrGap5+')',right.length,'var(--sim)'],
    ['균형형','두 점수의 차가 '+(CFG.lrGap-1)+'점 이하예요(5세 '+(CFG.lrGap5-1)+')',bal.length,'var(--sub)']
  ].map(function(r){return '<div class="brow"><div><b style="color:'+r[3]+'">'+r[0]+'</b><div class="small">'+r[1]+'</div></div><div><b>'+cntTxt(r[2],n)+'</b></div></div>';}).join('');
  return '<div class="bal"><div>'+svg+'<div class="legend"><span><i style="background:var(--suc)"></i>순차(Q) 우세</span><span><i style="background:var(--sim)"></i>동시(S) 우세</span><span><i style="background:var(--sub)"></i>균형</span><span>붉은 테두리는 위기 관리</span></div></div>'
    +'<div>'+rows
    +'<p class="pnote" style="margin-top:12px">균형인 학생 중 두 점수가 모두 '+CFG.lo+' 이하인 학생은 '+bl+'명, 모두 '+CFG.hi+' 이상인 학생은 '+bh+'명이에요. 균형이라도 두 점수가 함께 낮으면 “동시·순차 동반 저하”로 따로 살펴봐요.</p>'
    +'<p class="pnote">회색 띠는 두 점수의 차가 '+(CFG.lrGap-1)+'점 이하인 균형 구간이에요. 점선은 하('+CFG.lo+')와 상('+CFG.hi+') 기준선이에요.</p></div></div>';
}

function mixHTML(){

    return Math.max(S.A.filter(function(o){return o.a.dbl.indexOf(x)>=0;}).length,S.A.filter(function(o){return o.a.weak.indexOf(x)>=0;}).length);

function queueHTML(){
  var c=cur(),S=stats(c);
  var all=S.A.filter(function(o){return flagsFor(o.a).length;});
  all.sort(function(a,b){
    var pa=Math.min.apply(null,flagsFor(a.a).map(function(f){return FLAGPRI[f];})), pb=Math.min.apply(null,flagsFor(b.a).map(function(f){return FLAGPRI[f];}));
    return pa-pb||a.a.min-b.a.min;
  });
  var keys=['all','crisis','twoE','low2','support','edge'];
  var chips=keys.map(function(k){
    var cnt=k==='all'?all.length:all.filter(function(o){return flagsFor(o.a).indexOf(k)>=0;}).length;
    return '<button type="button" class="chipbtn" data-filter="'+k+'" aria-pressed="'+(state.filter===k)+'">'+(k==='all'?'전체':FLAGNAME[k])+' '+cnt+'</button>';
  }).join('');
  var list=state.filter==='all'?all:all.filter(function(o){return flagsFor(o.a).indexOf(state.filter)>=0;});
  var body=list.map(function(o){
    var tags=flagsFor(o.a).map(function(f){
      var cls=f==='crisis'?'tag crisis':(f==='twoE'?'tag gift':(f==='edge'?'tag':'tag warn'));
      var txt=FLAGNAME[f]; if(f==='edge')txt+=' '+o.a.edges.map(function(x){return x.n+' '+o.st.s[x.k];}).join(', ');
      return '<span class="'+cls+'">'+esc(txt)+'</span>';
    }).join('');
    var cur_=state.actions[o.st.id]||ACTIONS[0];
    var opts=ACTIONS.map(function(a){return '<option'+(a===cur_?' selected':'')+'>'+a+'</option>';}).join('');
    return '<tr><td><b>'+esc(o.st.id)+'</b><div class="small">'+esc(o.st.age)+'</div></td>'
      +SC.map(function(x){return '<td>'+scChip(o.st.s[x.k])+'</td>';}).join('')
      +'<td>'+tags+'</td><td><select id="act-'+esc(o.st.id)+'" aria-label="'+esc(o.st.id)+' 조치 상태">'+opts+'</select></td></tr>';
  }).join('');

  $('#toc').innerHTML='<div class="toc-title">목차</div>'+groups.map(function(g){

  var msg;
  if(state.source==='sample')msg='<p><b>예시 데이터</b>를 보고 있어요. 결과지 API가 연결되면 실제 계열 데이터로 모든 수치가 다시 계산돼요. 학생은 익명 ID로만 표시돼요.'+drop+'</p>';
  else if(state.source==='custom')msg='<p><b>직접 입력한 데이터</b>를 보고 있어요. 전체 비교의 다른 계열은 이전 데이터예요.'+drop+'</p>';
  else msg='<p><b>실제 검사 데이터</b>를 보고 있어요.'+drop+'</p>';
  $('#banner').innerHTML=msg;
}

/* 데이터 불러오기 */
function parseData(text){
  var lines=text.split(/\r?\n/).map(function(l){return l.trim();}).filter(Boolean);
  var errs=[],out=[],seen={};
  lines.forEach(function(line,i){
    var p=line.split(/[,\t]/).map(function(x){return x.trim();});
    if(i===0&&p.length>=5&&isNaN(Number(p[1])))return; // 머리글 줄 건너뜀
    if(p.length<5){errs.push((i+1)+'번째 줄: 열이 5개 이상이어야 해요(학생ID, 계획력, 주의력, 동시처리, 순차처리).');return;}
    var vals=p.slice(1,5).map(Number);
    if(vals.some(function(v){return !isFinite(v)||v<60||v>160;})){errs.push((i+1)+'번째 줄: 점수는 60~160 사이 숫자여야 해요.');return;}
    if(seen[p[0]]){errs.push((i+1)+'번째 줄: 학생ID "'+p[0]+'"가 중복돼요.');return;}
    seen[p[0]]=1;
    out.push({id:p[0],age:p[5]||'',s:{PLAN:Math.round(vals[0]),ATT:Math.round(vals[1]),SIM:Math.round(vals[2]),SUC:Math.round(vals[3])}});
  });
  return {rows:out,errs:errs};
}
function showMsg(html,cls){var m=$('#data-msg');if(m)m.innerHTML='<p class="'+cls+'">'+html+'</p>';}

document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='class-select'){state.cid=t.value;state.filter='all';state.parentId=null;state.careerStudentId=null;renderAllBodies();}
  else if(t.id==='career-student'){state.careerStudentId=t.value;renderBody('career','career-student');}
  else if(t.id==='pair-scale'){state.pairScale=t.value;renderBody('pairs','pair-scale');}
  else if(t.id==='parent-student'){state.parentId=t.value;renderBody('parent','parent-student');}
  else if(t.id&&t.id.indexOf('act-')===0){state.actions[t.id.slice(4)]=t.value;saveActions();renderBody('retest');}
});
document.addEventListener('click',function(e){
  var f=e.target.closest('[data-filter]');
  if(f){state.filter=f.getAttribute('data-filter');renderBody('queue');return;}
  var g=e.target.closest('[data-goto-class]');
  if(g){state.cid=g.getAttribute('data-goto-class');state.filter='all';state.parentId=null;renderAllBodies();window.scrollTo({top:0});return;}
  var id=e.target.id;
  if(id==='career-note-save'){
    state.careerNotes[careerNoteKey()]=$('#career-note').value;saveCareerNotes();var cs=$('#career-note-status');if(cs){cs.textContent=tr('common.saved',null,'저장되었습니다.');}return;
  }
  if(id==='btn-apply'){
    var r=parseData($('#data-text').value);
    if(r.errs.length){showMsg(esc(r.errs.slice(0,8).join('\n')),'err');return;}
    if(!r.rows.length){showMsg('학생 데이터가 없어요. 형식 예시를 참고해 붙여 넣어 주세요.','err');return;}
    var name=($('#data-name').value||'직접 입력').trim()||'직접 입력';
    classes.custom={id:'custom',label:name,grade:0,students:r.rows,enrolled:null,training:null};
    if(classOrder.indexOf('custom')<0)classOrder.push('custom');
    state.cid='custom';state.source='custom';state.filter='all';state.parentId=null;state.dropped=0;
    renderAllBodies();window.scrollTo({top:0});
  }else if(id==='btn-fill'){
    $('#data-text').value='A1,112,105,98,101\nA2,88,95,79,92\nA3,126,110,101,84\nA4,79,83,90,72\nA5,101,99,104,97\nA6,131,118,85,70';
  }else if(id==='btn-reset'){
    applyData(buildSampleList(),'sample');
    renderAllBodies();window.scrollTo({top:0});
  }
});
$('#btn-print').addEventListener('click',function(){try{window.print();}catch(e){}});

/* 목차 현재 위치 표시 */
function setupSpy(){
  var links={};
  document.querySelectorAll('[data-toc]').forEach(function(a){links[a.getAttribute('data-toc')]=a;});
  function on(id){Object.keys(links).forEach(function(k){links[k].classList.toggle('on',k===id);});var a=links[id];if(a&&window.matchMedia&&window.matchMedia('(max-width:900px)').matches){try{a.scrollIntoView({inline:'center',block:'nearest'});}catch(e){}}}
  if(!('IntersectionObserver' in window)){on('s-overview');return;}
  var io=new IntersectionObserver(function(entries){
    entries.forEach(function(en){if(en.isIntersecting)on(en.target.id);});
  },{rootMargin:'-20% 0px -70% 0px'});
  document.querySelectorAll('.sec').forEach(function(s){io.observe(s);});
  on('s-overview');
}

function applyRuntimeMeta(meta){state.meta=meta||{};var p=state.meta.policy||{};Object.keys(CFG).forEach(function(key){if(p[key]==null)return;if(typeof CFG[key]==='number'){var value=Number(p[key]);if(isFinite(value))CFG[key]=value;}else if(key!=='giftedMix')CFG[key]=p[key];});if(p.giftedMix)CFG.giftedMix=Object.assign({},CFG.giftedMix,p.giftedMix);}
function applyData(list,source,meta){
  applyRuntimeMeta(meta);
  var r=sanitize(list);
  classes=r.classes;classOrder=r.order;state.dropped=r.dropped;state.source=source;
  if(!classOrder.length){classes={};classOrder=[];return false;}
  if(!classes[state.cid]){
    var wanted=CONTEXT.classId&&classes[CONTEXT.classId]?CONTEXT.classId:classOrder[0];
    state.cid=wanted;
  }
  state.filter='all';state.parentId=null;
  return true;
}
function showFatal(msg){
  $('#banner').innerHTML='<p style="background:var(--orange-soft);border-left-color:var(--t-crisis)"><b>'+esc(tr('runtime.error.title',null,'데이터를 불러오지 못했어요.'))+'</b> '+esc(msg)+' '+esc(tr('runtime.error.help',null,'페이지를 새로고침하거나 관리자에게 문의하세요.'))+'</p>';
  $('#main').innerHTML='<section class="sec"><div class="empty">'+esc(tr('runtime.empty',null,'표시할 학급 데이터가 없어요.'))+'</div><div id="b-data"></div></section>';
  buildShell();$('#b-data')&&renderBody('data');
}
function errorText(err){return tr('runtime.error.'+String(err&&err.code||'unknown').toLowerCase(),err&&err.details,err&&err.message||'결과지 데이터를 불러오지 못했습니다.');}
function boot(){
  buildShell();
  $('#banner').innerHTML='<p>'+esc(tr('runtime.loading.track',null,'학과 데이터를 불러오는 중이에요…'))+'</p>';
  var p;
  try{ p=DATA.load(CONTEXT); }catch(e){ p=Promise.reject(e); }
  Promise.resolve(p).then(function(res){
    var ok=applyData((res&&res.classes)||[], (res&&res.source)||'live',res&&res.meta);
    if(!ok){ showFatal(tr('runtime.error.empty_results',null,'학급 데이터가 비어 있어요.')); return; }
    renderAllBodies();setupSpy();
  }).catch(function(err){
    if(err&&err.dashboardFatal){showFatal(errorText(err));return;}
    // 연동 실패 시에도 화면이 비지 않도록 예시 데이터로 대체
    var ok=applyData(buildSampleList(),'sample');
    if(ok){renderAllBodies();setupSpy();
      $('#banner').innerHTML='<p style="background:var(--orange-soft)"><b>실제 데이터를 불러오지 못해 예시 데이터를 보여주고 있어요.</b> ('+esc(err&&err.message||'오류')+')</p>';
    }else{ showFatal(err&&err.message||'알 수 없는 오류'); }
  });
}
var booted=false;function bootOnce(){if(booted)return;booted=true;boot();}
window.addEventListener('kpass-locale-ready',function(){if(classOrder.length)renderAllBodies();else bootOnce();});
if(window.kpassT)bootOnce();
})();
</script>
